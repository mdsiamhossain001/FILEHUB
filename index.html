                isPromptUpload: true,
                created_at: Date.now(), total_downloads: 0,
                uploadedBy: currentUser.uid, uploadedByEmail: currentUser.email,
                pointsAwarded: false
            };
            try {
                await filesRef.push(data);
                const el = document.getElementById('uploadAlert2');
                el.className = 'alert alert-success';
                el.innerText = '✅ Prompt uploaded! এডমিন approve করলে আপনি ' + getPointSettings().promptUploadReward + ' পয়েন্ট পাবেন।';
                document.getElementById('uploadPromptForm').reset();
                setTimeout(() => navigateTo('/profile'), 2000);
            } catch(err) {
                const el = document.getElementById('uploadAlert2');
                el.className = 'alert alert-error';
                el.innerText = err.message;
                btn.disabled = false; btn.innerHTML = cssEmoji('magic') + ' Upload Prompt';
            }
        });
    }

    // ==================== PROFILE ====================
    function renderProfile() {
        document.title = 'Profile - FileHub';
        const userFiles = allFiles.filter(f => f.uploadedBy === currentUser.uid);
        const totalDownloads = userFiles.reduce((s, f) => s + (f.total_downloads || 0), 0);
        const approved = userFiles.filter(f => f.status === 'approved').length;
        const pending = userFiles.filter(f => f.status === 'pending').length;
        const rejected = userFiles.filter(f => f.status === 'rejected').length;
        const bal = (currentUserData && currentUserData.balance) || 0;
        const ws = getWithdrawSettings();
        const balanceTk = (bal / ws.pointToTaka).toFixed(2);
        
        const username = (currentUserData && currentUserData.username) || 'user';
        const fullname = (currentUserData && currentUserData.fullname) || 'User';
        const avatar = (currentUserData && currentUserData.avatar) || 'https://i.postimg.cc/VkCqsjD1/file-00000000fa18821191576f156d4e3bfe.png';
        const displayId = (currentUserData && currentUserData.numericId) || currentUser.uid.substring(0, 10);

        app.innerHTML = 
            '<div class="profile-header">' +
                '<img src="' + escapeHtmlUser(avatar) + '" class="profile-avatar" onclick="openLightbox(this.src)">' +
                '<div style="position:relative; z-index:1;"><h1 class="profile-name">' + escapeHtmlUser(fullname) + '</h1>' +
                '<div class="profile-username">@' + escapeHtmlUser(username) + '</div>' +
                '<div class="profile-id">' + cssEmoji('user') + ' ID: ' + displayId + '</div></div>' +
            '</div>' +
            '<div class="stats-grid">' +
                '<div class="stat-card"><div class="stat-icon">' + cssEmoji('money') + '</div><div><div class="stat-value">' + bal + '</div><div class="stat-label">Points</div></div></div>' +
                '<div class="stat-card"><div class="stat-icon" style="background:var(--success-light);color:var(--success);">' + cssEmoji('wallet') + '</div><div><div class="stat-value">' + balanceTk + '৳</div><div class="stat-label">Balance</div></div></div>' +
                '<div class="stat-card"><div class="stat-icon">' + cssEmoji('download') + '</div><div><div class="stat-value">' + totalDownloads + '</div><div class="stat-label">Downloads</div></div></div>' +
                '<div class="stat-card"><div class="stat-icon">' + cssEmoji('upload') + '</div><div><div class="stat-value">' + userFiles.length + '</div><div class="stat-label">Uploads</div></div></div>' +
            '</div>' +
            '<div class="profile-actions">' +
                '<button class="action-btn" onclick="openEditProfileModal()">' + cssEmoji('edit') + ' Edit Profile</button>' +
                '<button class="action-btn" onclick="openWithdrawModal()">' + cssEmoji('money-bill') + ' Withdraw</button>' +
                '<button class="action-btn" onclick="openPointHistory()">' + cssEmoji('history') + ' History</button>' +
                '<button class="action-btn danger" onclick="logout()">' + cssEmoji('times') + ' Logout</button>' +
            '</div>' +
            '<div class="uploads-section">' +
                '<h2 class="uploads-title">' + cssEmoji('upload') + ' Your Uploads</h2>' +
                '<div style="display:flex;gap:12px;margin-bottom:20px;font-size:.85rem; font-weight:600;">' +
                    '<span style="color:var(--success); background:var(--success-light); padding:4px 10px; border-radius:20px;">' + cssEmoji('check') + ' ' + approved + ' approved</span>' +
                    '<span style="color:var(--warning); background:var(--warning-light); padding:4px 10px; border-radius:20px;">' + cssEmoji('clock') + ' ' + pending + ' pending</span>' +
                    '<span style="color:var(--danger); background:var(--danger-light); padding:4px 10px; border-radius:20px;">' + cssEmoji('times') + ' ' + rejected + ' rejected</span>' +
                '</div>' +
                '<div class="file-grid">' +
                    (userFiles.length === 0 
                        ? '<div class="no-uploads" style="grid-column:1/-1;"><i class="fas fa-cloud-upload-alt" style="font-size:3rem; opacity:0.3; margin-bottom:16px;"></i><p style="font-weight:600; font-size:1.1rem; margin-bottom:16px;">No uploads yet.</p><button class="btn btn-primary" style="width:auto;" onclick="navigateTo(\'/upload\')">Upload Now</button></div>'
                        : userFiles.map(f => {
                            const cls = f.status === 'approved' ? 'status-approved' : f.status === 'pending' ? 'status-pending' : 'status-rejected';
                            const statusIcon = f.status === 'approved' ? cssEmoji('check') : f.status === 'pending' ? cssEmoji('clock') : cssEmoji('times');
                            const badge = f.isPromptUpload ? '<span class="prompt-file-badge">' + cssEmoji('magic') + ' Prompt</span>' : '';
                            return '<div class="file-card" onclick="navigateTo(\'/file/' + f.id + '\')">' + badge +
                                '<div class="card-thumb-wrap"><img src="' + escapeHtmlUser(f.thumbnail_url || '') + '" class="card-thumb" loading="lazy" onerror="this.src=\'https://i.postimg.cc/VkCqsjD1/file-00000000fa18821191576f156d4e3bfe.png\'"></div>' +
                                '<div class="card-body"><div class="card-title">' + escapeHtmlUser(f.title) + '</div>' +
                                '<div class="card-footer"><span class="status-badge ' + cls + '">' + statusIcon + ' ' + (f.status || 'pending') + '</span>' +
                                '<span class="meta-pill">' + cssEmoji('download') + ' ' + (f.total_downloads || 0) + '</span></div></div></div>';
                        }).join('')
                    ) +
                '</div>' +
            '</div>';
    }

    window.openEditProfileModal = function() {
        document.getElementById('editProfileModalContent').innerHTML = 
            '<h2 class="modal-title">Edit Profile</h2>' +
            '<div id="editAlert" class="alert hidden"></div>' +
            '<form id="editForm">' +
                '<div class="form-group"><label class="form-label">Full Name</label><input type="text" id="e-name" class="form-control" value="' + escapeHtmlUser((currentUserData && currentUserData.fullname) || '') + '"></div>' +
                '<div class="form-group"><label class="form-label">Username</label><input type="text" id="e-user" class="form-control" value="' + escapeHtmlUser((currentUserData && currentUserData.username) || '') + '"></div>' +
                '<div class="form-group"><label class="form-label">Avatar URL</label><input type="url" id="e-avatar" class="form-control" value="' + escapeHtmlUser((currentUserData && currentUserData.avatar) || '') + '"></div>' +
                '<button type="submit" class="btn btn-primary">Save Changes</button>' +
            '</form>';
        document.getElementById('editForm').addEventListener('submit', async e => {
            e.preventDefault();
            const updates = {
                fullname: document.getElementById('e-name').value,
                username: document.getElementById('e-user').value,
                avatar: document.getElementById('e-avatar').value
            };
            try {
                await usersRef.child(currentUser.uid).update(updates);
                currentUserData = { ...currentUserData, ...updates };
                closeModal('editProfileModal');
                renderProfile();
            } catch(err) { alert(err.message); }
        });
        openModal('editProfileModal');
    };

    // ⭐ WITHDRAW MODAL WITH CHARGE CALCULATION
    window.openWithdrawModal = function() {
        const ws = getWithdrawSettings();
        const bal = (currentUserData && currentUserData.balance) || 0;
        const methodsHtml = Object.entries(ws.methods).filter(([, m]) => m.enabled !== false).map(([k, m]) => 
            '<label style="display:flex;align-items:center;gap:12px;padding:16px;border:2px solid var(--border);border-radius:var(--radius-md);cursor:pointer;margin-bottom:12px; transition:0.2s;" onmouseover="this.style.borderColor=\'var(--primary)\'" onmouseout="this.style.borderColor=\'var(--border)\'">' +
                '<input type="radio" name="wdM" value="' + k + '" style="width:20px;height:20px; accent-color:var(--primary);">' +
                (m.image ? '<img src="' + escapeHtmlUser(m.image) + '" style="width:48px;height:48px;border-radius:8px;object-fit:cover;">' : '') +
                '<div style="flex:1;"><div style="font-weight:700; font-size:1rem;">' + escapeHtmlUser(m.name || k) + '</div>' +
                '<div style="font-size:.85rem;color:var(--text-sub);">' + escapeHtmlUser(m.number || '') + '</div></div>' +
            '</label>'
        ).join('');

        document.getElementById('withdrawModalContent').innerHTML =
            '<h2 class="modal-title">Withdraw Points</h2>' +
            '<div class="alert alert-info" style="font-weight:600;">' + cssEmoji('info') + ' ' + ws.pointToTaka + ' পয়েন্ট = ১ টাকা · সর্বনিম্ন ' + ws.minWithdraw + ' পয়েন্ট</div>' +
            
            '<div style="text-align:center;margin:24px 0; background:var(--bg); padding:20px; border-radius:var(--radius-lg);">' +
                '<div style="font-size:2.8rem;font-weight:800;color:var(--primary); font-family:Outfit;">' + bal + '</div>' +
                '<div style="color:var(--text-sub); font-weight:600; margin-bottom:8px;">আপনার পয়েন্ট</div>' +
                '<div style="color:var(--success);font-weight:700; font-size:1.1rem; background:var(--success-light); display:inline-block; padding:4px 12px; border-radius:20px;">≈ ' + (bal / ws.pointToTaka).toFixed(2) + ' টাকা</div>' +
            '</div>' +
            
            // Charge Info Display
            (ws.chargeAmount > 0 ? 
            '<div style="background:var(--warning-light); border-left:4px solid var(--warning); padding:12px; border-radius:8px; margin-bottom:20px;">' +
                '<div style="font-weight:700; color:#92400e; font-size:0.9rem; display:flex; align-items:center; gap:6px;">' +
                    cssEmoji('info') + ' Withdraw Charge: ' + 
                    (ws.chargeType === 'percent' ? ws.chargeAmount + '%' : ws.chargeAmount + ' Points') +
                '</div>' +
                '<div style="font-size:0.8rem; color:#92400e; margin-top:4px;">চার্জ বাদ দিয়ে বাকি টাকা আপনার অ্যাকাউন্টে যাবে।</div>' +
            '</div>' : '') +

            '<div id="wdAlert" class="alert hidden"></div>' +
            (Object.keys(ws.methods).length === 0 
                ? '<p style="text-align:center;color:var(--text-sub);padding:20px;">কোনো পেমেন্ট মেথড নেই।</p>'
                : '<form id="wdForm">' +
                    '<div class="form-group"><label class="form-label">Method</label>' + methodsHtml + '</div>' +
                    '<div class="form-group"><label class="form-label">Amount (points)</label><input type="number" id="wdAmount" class="form-control" min="' + ws.minWithdraw + '" required></div>' +
                    '<div class="form-group"><label class="form-label">Your Account Number</label><input type="text" id="wdAccount" class="form-control" required></div>' +
                    '<button type="submit" class="btn btn-primary">Submit Request</button>' +
                '</form>');
        
        const form = document.getElementById('wdForm');
        if (form) form.addEventListener('submit', async e => {
            e.preventDefault();
            const method = document.querySelector('input[name="wdM"]:checked');
            if (!method) { document.getElementById('wdAlert').className = 'alert alert-error'; document.getElementById('wdAlert').innerText = 'Select method'; return; }
            const amount = parseInt(document.getElementById('wdAmount').value);
            const account = document.getElementById('wdAccount').value.trim();
            if (amount < ws.minWithdraw) { document.getElementById('wdAlert').className = 'alert alert-error'; document.getElementById('wdAlert').innerText = 'Minimum ' + ws.minWithdraw; return; }
            if (amount > bal) { document.getElementById('wdAlert').className = 'alert alert-error'; document.getElementById('wdAlert').innerText = 'Insufficient'; return; }
            
            // Deduct amount from user balance
            const ok = await deductPointsFromUser(currentUser.uid, amount, 'withdraw_request');
            if (!ok) return;
            
            // Calculate Charge for record
            let chargePts = 0;
            if (ws.chargeType === 'percent') {
                chargePts = (amount * ws.chargeAmount) / 100;
            } else {
                chargePts = ws.chargeAmount;
            }
            const finalTaka = (amount - chargePts) / ws.pointToTaka;
            
            await withdrawalsRef.push({
                uid: currentUser.uid, email: currentUser.email,
                username: (currentUserData && currentUserData.username) || '',
                method: method.value, amount: amount, taka: finalTaka,
                chargeApplied: chargePts,
                account: account, status: 'pending', createdAt: Date.now()
            });
            
            document.getElementById('wdAlert').className = 'alert alert-success';
            document.getElementById('wdAlert').innerText = '✅ Request sent! ' + finalTaka.toFixed(2) + '৳ পাবেন (চার্জ বাদ দিয়ে)।';
            const snap = await usersRef.child(currentUser.uid).once('value');
            currentUserData = snap.val() || currentUserData;
            setTimeout(() => { closeModal('withdrawModal'); renderProfile(); }, 2000);
        });
        openModal('withdrawModal');
    };

    window.openPointHistory = async function() {
        const snap = await pointLogsRef.child(currentUser.uid).orderByChild('timestamp').limitToLast(50).once('value');
        const logs = snap.val() ? Object.entries(snap.val()).map(([id, d]) => ({ id, ...d })).sort((a, b) => b.timestamp - a.timestamp) : [];
        document.getElementById('pointHistoryModalContent').innerHTML =
            '<h2 class="modal-title">Point History</h2>' +
            (logs.length === 0 ? '<p style="color:var(--text-sub);text-align:center;padding:20px;">No transactions</p>' :
            '<div>' + logs.map(l => 
                '<div style="display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--border);">' +
                    '<div><div style="font-weight:700;font-size:.95rem; margin-bottom:4px; color:var(--text-main);">' + escapeHtmlUser(l.reason || 'system') + '</div>' +
                    '<div style="font-size:.8rem;color:var(--text-sub);">' + new Date(l.timestamp).toLocaleString() + '</div></div>' +
                    '<div style="font-weight:800; font-size:1.1rem; color:' + (l.amount >= 0 ? 'var(--success)' : 'var(--danger)') + ';">' + (l.amount >= 0 ? '+' : '') + l.amount + '</div>' +
                '</div>'
            ).join('') + '</div>');
        openModal('pointHistoryModal');
    };

    window.logout = async function() { await auth.signOut(); dataLoaded = false; dataLoadingPromise = null; navigateTo('/'); };

    // ==================== INIT ====================
    currentRoute = window.location.hash.substring(1) || '/';
    renderHomeSkeleton();
    setTimeout(() => { 
        if (!app.innerHTML.trim() || app.innerHTML.includes('skeleton')) {
            handleRoute();
        }
    }, 50);
    loadData();
</script>
</body>
</html>
