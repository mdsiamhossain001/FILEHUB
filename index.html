<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/VkCqsjD1/file-00000000fa18821191576f156d4e3bfe.png">
    <title>FileHub - Secure File Sharing</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
            } catch(e) {}
        })();
    </script>
    <style>
        /* ============ PREMIUM COLOR PALETTE ============ */
        :root {
            --primary: #6366f1; 
            --primary-dark: #4f46e5;
            --primary-light: #e0e7ff;
            --primary-glow: rgba(99, 102, 241, 0.4);
            
            --bg: #f4f7fb; 
            --surface: #ffffff; 
            --surface-glass: rgba(255, 255, 255, 0.85);
            
            --text-main: #0f172a; 
            --text-sub: #64748b;
            --border: #e2e8f0; 
            --border-glass: rgba(255, 255, 255, 0.5);
            
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
            --shadow-lg: 0 20px 40px -10px rgba(0,0,0,0.08);
            
            --nav-height: 70px; 
            
            --success: #10b981; 
            --success-light: #d1fae5;
            --danger: #ef4444; 
            --danger-light: #fee2e2;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            
            --unread-bg: #eff6ff; 
            --unread-border: #3b82f6;
            
            --chat-user-bg: #6366f1; 
            --chat-user-text: #fff; 
            --chat-ai-bg: #ffffff; 
            --chat-ai-text: #0f172a;
            
            --skeleton-base: #e2e8f0; 
            --skeleton-highlight: #f8fafc;
            --radius-sm: 12px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-pill: 50px;
        }
        
        [data-theme="dark"] {
            --primary: #818cf8; 
            --primary-dark: #6366f1;
            --primary-light: #1e293b;
            --primary-glow: rgba(129, 140, 248, 0.4);
            
            --bg: #0b1120; 
            --surface: #1e293b; 
            --surface-glass: rgba(30, 41, 59, 0.85);
            
            --text-main: #f8fafc; 
            --text-sub: #94a3b8;
            --border: #334155; 
            --border-glass: rgba(255, 255, 255, 0.1);
            
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.2);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.4);
            --shadow-lg: 0 20px 40px -10px rgba(0,0,0,0.6);
            
            --success: #34d399; 
            --success-light: #064e3b;
            --danger: #f87171; 
            --danger-light: #7f1d1d;
            --warning: #fbbf24;
            --warning-light: #78350f;
            
            --unread-bg: #1e3a8a; 
            --unread-border: #60a5fa;
            
            --chat-user-bg: #6366f1; 
            --chat-user-text: #fff; 
            --chat-ai-bg: #334155; 
            --chat-ai-text: #f8fafc;
            
            --skeleton-base: #1e293b; 
            --skeleton-highlight: #334155;
        }

        /* ============ BASE STYLES ============ */
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body { overflow-x: hidden; }
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding-bottom: calc(var(--nav-height) + 40px + env(safe-area-inset-bottom, 0px)); 
            transition: background .3s, color .3s;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-sub); }

        /* ============ EMOJI SYSTEM ============ */
        .css-emoji { 
            display: inline-flex; align-items: center; justify-content: center; 
            width: 1.2em; height: 1.2em; vertical-align: middle; 
            font-family: 'Font Awesome 6 Free', sans-serif; font-weight: 900; line-height: 1; 
        }

        /* ============ GLASS HEADER ============ */
        header { 
            background: var(--surface-glass); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass); 
            position: sticky; top: 0; z-index: 1000; 
            height: 70px; display: flex; align-items: center; 
            box-shadow: var(--shadow-sm);
        }
        .header-content { 
            width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; }
        .brand-img { 
            width: 40px; height: 40px; border-radius: var(--radius-sm); object-fit: cover; 
            box-shadow: 0 4px 10px var(--primary-glow);
        }
        .brand-text { 
            font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 800; 
            background: linear-gradient(135deg, var(--primary), #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .header-actions { display: flex; gap: 8px; }
        .icon-btn { 
            background: var(--surface); border: 1px solid var(--border); 
            padding: 8px; border-radius: 50%; color: var(--text-sub); 
            cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; 
            transition: all 0.2s; width: 40px; height: 40px;
            box-shadow: var(--shadow-sm);
        }
        .icon-btn:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
        .icon-btn svg { width: 20px; height: 20px; }
        .ai-icon-img { width: 24px; height: 24px; border-radius: 50%; }
        
        .notif-badge { 
            position: absolute; top: -2px; right: -2px; background: var(--danger); 
            color: #fff; font-size: .6rem; font-weight: 700; 
            min-width: 18px; height: 18px; border-radius: 10px; 
            display: none; align-items: center; justify-content: center; 
            border: 2px solid var(--surface); padding: 0 4px;
        }
        .notif-badge.active { display: flex; }

        /* ============ CONTAINER ============ */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px 16px; }
        @media (min-width: 768px) { .container { padding: 30px 20px; } }
        
        /* ============ FILE GRID ============ */
        .file-grid { 
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); 
            gap: 14px; width: 100%;
        }
        @media (min-width: 768px) { .file-grid { gap: 24px; } }
        @media (max-width: 380px) { .file-grid { gap: 10px; } }
        
        .file-card { 
            background: var(--surface); border-radius: var(--radius-md); 
            box-shadow: var(--shadow-sm); overflow: hidden; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; flex-direction: column; border: 1px solid var(--border); 
            position: relative; min-width: 0;
        }
        .file-card:hover { 
            transform: translateY(-5px); border-color: var(--primary); 
            box-shadow: var(--shadow-lg); 
        }
        .card-thumb-wrap { 
            position: relative; width: 100%; aspect-ratio: 16/10; 
            overflow: hidden; background: var(--border);
        }
        .card-thumb { 
            width: 100%; height: 100%; object-fit: cover; 
            display: block; transition: transform 0.5s ease; 
        }
        .file-card:hover .card-thumb { transform: scale(1.08); }
        
        .card-body { padding: 12px; display: flex; flex-direction: column; flex: 1; min-width: 0; }
        @media (min-width: 768px) { .card-body { padding: 16px; } }
        
        .card-title { 
            font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.9rem; 
            margin-bottom: 8px; line-height: 1.4; display: -webkit-box; 
            -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; 
            height: 2.8em; word-break: break-word; color: var(--text-main);
        }
        @media (min-width: 768px) { .card-title { font-size: 1.05rem; height: 2.8em; } }
        
        .card-footer { 
            margin-top: auto; display: flex; justify-content: space-between; 
            align-items: center; padding-top: 10px; border-top: 1px solid var(--border); 
            gap: 6px; flex-wrap: wrap;
        }
        .meta-pill { 
            background: var(--bg); color: var(--text-sub); 
            padding: 3px 8px; border-radius: var(--radius-sm); font-size: 0.65rem; 
            font-weight: 600; display: flex; align-items: center; gap: 4px; 
            white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
        }
        @media (min-width: 768px) { .meta-pill { font-size: .75rem; padding: 4px 10px; } }
        
        .prompt-file-badge, .apk-file-badge { 
            position: absolute; top: 8px; left: 8px; color: #fff; padding: 3px 8px; 
            border-radius: var(--radius-pill); font-size: .6rem; font-weight: 800; 
            text-transform: uppercase; z-index: 3; display: flex; align-items: center; 
            gap: 4px; white-space: nowrap; backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        @media (min-width: 768px) { 
            .prompt-file-badge, .apk-file-badge { top: 12px; left: 12px; padding: 4px 12px; font-size: .7rem; } 
        }
        .prompt-file-badge { background: linear-gradient(135deg, #8b5cf6, #a78bfa); }
        .apk-file-badge { background: linear-gradient(135deg, #10b981, #34d399); }
        
        /* ⭐ NEW: Only Download Points Badge (Earn) */
        .download-points-badge { 
            position: absolute; top: 8px; right: 8px; color: #fff; 
            padding: 4px 10px; border-radius: var(--radius-pill); 
            font-size: .65rem; font-weight: 800; z-index: 3; 
            background: linear-gradient(135deg, #10b981, #34d399); 
            white-space: nowrap; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.4);
            display: flex; align-items: center; gap: 4px;
        }
        @media (min-width: 768px) { 
            .download-points-badge { top: 12px; right: 12px; padding: 4px 12px; font-size: .7rem; } 
        }

        /* ============ SECTION HEADERS ============ */
        .section-header { display: flex; align-items: center; gap: 10px; margin: 28px 0 16px; }
        .section-header h2 { font-family: 'Outfit', sans-serif; font-size: 1.2rem; margin: 0; font-weight: 800; }
        @media (min-width: 768px) { .section-header h2 { font-size: 1.5rem; } }
        .section-count { 
            background: var(--primary-light); color: var(--primary); 
            padding: 4px 12px; border-radius: var(--radius-pill); 
            font-size: .75rem; font-weight: 800; margin-left: auto; 
        }

        /* ============ CAROUSEL ============ */
        .carousel-wrap { 
            width: 100%; aspect-ratio: 16/9; margin-bottom: 12px; 
            border-radius: var(--radius-lg); overflow: hidden; 
            position: relative; box-shadow: var(--shadow-md); 
        }
        .carousel-inner { display: flex; height: 100%; transition: transform .6s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide { min-width: 100%; height: 100%; position: relative; cursor: pointer; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        .carousel-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 25px; }
        .dot-c { width: 6px; height: 6px; background: var(--border); border-radius: 50%; transition: .3s; }
        .dot-c.active { background: var(--primary); width: 20px; border-radius: 3px; }

        /* ============ PREMIUM NAVIGATION ============ */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height); 
            background: var(--surface-glass); border-top: 1px solid var(--border-glass); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: grid; grid-template-columns: 1fr 90px 1fr; align-items: center; 
            z-index: 1001; padding-bottom: env(safe-area-inset-bottom, 0px); 
            box-sizing: content-box;
        }
        .nav-col { display: flex; justify-content: center; align-items: center; height: 100%; }
        .nav-item { 
            background: none; border: none; color: var(--text-sub); cursor: pointer; 
            padding: 10px 16px; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; gap: 4px; border-radius: var(--radius-md); 
            transition: all .25s ease; font-family: inherit;
        }
        .nav-item svg { width: 24px; height: 24px; stroke-width: 2; transition: transform 0.2s; }
        .nav-item .nav-label { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.3px; }
        .nav-item:active svg { transform: scale(0.85); }
        .nav-item:hover { color: var(--primary); }
        
        .nav-home-wrapper { 
            position: relative; width: 90px; height: 100%; 
            display: flex; justify-content: center; align-items: flex-start; 
            overflow: visible;
        }
        .nav-home { 
            position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
            width: 60px; height: 60px; 
            background: linear-gradient(135deg, var(--primary), #a78bfa);
            color: #fff; border-radius: 50%; border: 4px solid var(--bg); 
            display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 8px 24px var(--primary-glow);
            cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); 
            z-index: 1002;
        }
        .nav-home svg { width: 28px; height: 28px; stroke-width: 2.2; }
        .nav-home:hover { transform: translateX(-50%) translateY(-3px) scale(1.05); }
        .nav-home:active { transform: translateX(-50%) scale(0.95); }

        /* ============ BOTTOM SHEET ============ */
        .bottom-sheet-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,.6); 
            backdrop-filter: blur(4px); z-index: 2000; 
            opacity: 0; visibility: hidden; transition: .3s; 
        }
        .bottom-sheet-overlay.active { opacity: 1; visibility: visible; }
        .bottom-sheet { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 85vh; 
            background: var(--surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0; 
            z-index: 2001; transform: translateY(100%); 
            transition: transform .4s cubic-bezier(0.32, 0.72, 0, 1), height .4s; 
            display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
        }
        .bottom-sheet.active { transform: translateY(0); }
        .bottom-sheet.expanded { height: 100% !important; border-radius: 0; }
        .sheet-header { 
            padding: 16px 20px; border-bottom: 1px solid var(--border); 
            display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; 
        }
        .sheet-title { font-family: 'Outfit', sans-serif; font-weight: 800; text-align: center; font-size: 1.1rem; }
        .sheet-btn { background: none; border: none; cursor: pointer; color: var(--text-sub); padding: 8px; display: flex; justify-content: center; }
        .sheet-body { flex: 1; overflow-y: auto; }

        /* ============ CHAT UI ============ */
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; background: var(--bg); }
        .chat-bubble { max-width: 85%; padding: 14px 18px; border-radius: 20px; font-size: .95rem; line-height: 1.5; word-wrap: break-word; box-shadow: var(--shadow-sm); }
        .chat-bubble.user { align-self: flex-end; background: var(--chat-user-bg); color: var(--chat-user-text); border-bottom-right-radius: 4px; }
        .chat-bubble.ai { align-self: flex-start; background: var(--chat-ai-bg); color: var(--chat-ai-text); border-bottom-left-radius: 4px; display: flex; gap: 12px; max-width: 95%; border: 1px solid var(--border); }
        .ai-avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .ai-content { flex: 1; min-width: 0; }
        .chat-footer { padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; }
        .chat-input { flex: 1; background: var(--bg); border: 2px solid transparent; border-radius: 20px; padding: 12px 16px; color: var(--text-main); resize: none; outline: none; font-family: inherit; transition: 0.2s; max-height: 120px; }
        .chat-input:focus { border-color: var(--primary); background: var(--surface); }
        .chat-send-btn { width: 46px; height: 46px; border-radius: 50%; background: var(--primary); color: #fff; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; box-shadow: 0 4px 12px var(--primary-glow); }
        .chat-send-btn:hover { transform: scale(1.05); }
        .chat-send-btn svg { width: 20px; height: 20px; fill: white; margin-left: -2px; }

        /* ============ AI FILE BUTTONS ============ */
        .ai-file-btn { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-md); padding: 14px; margin: 12px 0; cursor: pointer; transition: all 0.3s; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; text-decoration: none; color: inherit; width: 100%; box-sizing: border-box; }
        .ai-file-btn::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--primary); }
        .ai-file-btn:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 25px rgba(99,102,241,0.15); }
        .ai-file-btn-icon { width: 46px; height: 46px; border-radius: var(--radius-sm); background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; color: var(--primary); }
        .ai-file-btn-info { flex: 1; min-width: 0; }
        .ai-file-btn-title { font-weight: 700; font-size: 0.95rem; color: var(--text-main); line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .ai-file-btn-meta { display: flex; align-items: center; gap: 8px; }
        .ai-file-btn-ext { background: var(--primary); color: white; padding: 2px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .ai-file-btn-arrow { width: 32px; height: 32px; border-radius: 50%; background: var(--bg); color: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s; }
        .ai-file-btn:hover .ai-file-btn-arrow { background: var(--primary); color: white; transform: translateX(4px); }

        /* ============ MODALS ============ */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(8px); z-index: 3000; display: none; justify-content: center; align-items: center; padding: 16px; }
        .modal-overlay.active { display: flex; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
        .modal-content { background: var(--surface); border-radius: var(--radius-lg); padding: 32px 24px; max-width: 460px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: var(--shadow-lg); animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes slideUp { from{transform:translateY(20px);opacity:0;} to{transform:translateY(0);opacity:1;} }
        .modal-close { position: absolute; top: 16px; right: 16px; background: var(--bg); border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--text-sub); cursor: pointer; transition: 0.2s; }
        .modal-close:hover { background: var(--danger-light); color: var(--danger); transform: rotate(90deg); }
        .modal-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 24px; font-family: 'Outfit', sans-serif; }

        /* ============ FORMS ============ */
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: var(--radius-md); background: var(--bg); color: var(--text-main); font-size: 1rem; font-family: inherit; transition: 0.2s; }
        .form-control:focus { outline: none; border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px var(--primary-light); }
        .btn { padding: 14px 24px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; border: none; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; width: 100%; box-shadow: 0 4px 15px var(--primary-glow); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px var(--primary-glow); }
        .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

        /* ============ ALERTS ============ */
        .alert { padding: 14px 16px; border-radius: var(--radius-md); margin-bottom: 20px; font-size: .9rem; display: flex; align-items: center; gap: 10px; font-weight: 500; }
        .alert-success { background: var(--success-light); color: #065f46; border-left: 4px solid var(--success); }
        .alert-error { background: var(--danger-light); color: #991b1b; border-left: 4px solid var(--danger); }
        .alert-info { background: #dbeafe; color: #1e40af; border-left: 4px solid #3b82f6; }

    // ==================== HELPERS ====================
    function escapeHtmlUser(str) {
        if (!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
    function formatCount(n) {
        if (!n) return '0';
        if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'m';
        if (n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'k';
        return n;
    }
    function timeAgoShort(ts) {
        if (!ts) return 'recent';
        const s = Math.floor((Date.now() - ts) / 1000);
        if (s < 60) return 'just now';
        if (s < 3600) return Math.floor(s/60)+'m ago';
        if (s < 86400) return Math.floor(s/3600)+'h ago';
        if (s < 2592000) return Math.floor(s/86400)+'d ago';
        return Math.floor(s/2592000)+'mo ago';
    }

    function cssEmoji(type, size) {
        const sizeClass = size || '';
        const icons = {
            'money': 'fa-coins', 'wallet': 'fa-wallet', 'file': 'fa-file', 'folder': 'fa-folder',
            'apk': 'fa-android', 'magic': 'fa-wand-magic-sparkles', 'ai': 'fa-robot',
            'download': 'fa-download', 'upload': 'fa-upload', 'copy': 'fa-copy',
            'check': 'fa-check', 'times': 'fa-times', 'clock': 'fa-clock',
            'lock': 'fa-lock', 'eye': 'fa-eye', 'user': 'fa-user', 'info': 'fa-circle-info',
            'external': 'fa-arrow-up-right-from-square', 'history': 'fa-clock-rotate-left',
            'money-bill': 'fa-money-bill-wave', 'edit': 'fa-pen-to-square', 'share': 'fa-share-nodes',
            'link': 'fa-link', 'gemini': 'fa-gem'
        };
        return '<i class="fas ' + (icons[type] || 'fa-circle') + ' css-emoji ' + sizeClass + '"></i>';
    }

    // ==================== POINT SETTINGS ====================
    function getPointSettings() {
        const p = appSettings.points || {};
        return {
            uploadReward: p.uploadReward !== undefined ? Number(p.uploadReward) : 10,
            downloadReward: p.downloadReward !== undefined ? Number(p.downloadReward) : 0, // ⭐ User Income on Download
            uploaderReward: p.uploaderReward !== undefined ? Number(p.uploaderReward) : 5,
            uploaderEarnsOnDownload: p.uploaderEarnsOnDownload !== false,
            promptUploadReward: p.promptUploadReward !== undefined ? Number(p.promptUploadReward) : 15,
            promptDownloadReward: p.promptDownloadReward !== undefined ? Number(p.promptDownloadReward) : 0, // ⭐ User Income on Prompt Copy
            promptUploaderReward: p.promptUploaderReward !== undefined ? Number(p.promptUploaderReward) : 8
        };
    }
    function getWithdrawSettings() {
        const w = appSettings.withdraw || {};
        return { 
            pointToTaka: w.pointToTaka ?? 100, 
            minWithdraw: w.minWithdraw ?? 500, 
            chargeType: w.chargeType ?? 'percent', // 'percent' or 'fixed'
            chargeAmount: w.chargeAmount ?? 0,
            methods: w.methods || {} 
        };
    }

    // ==================== POINTS (EARN ONLY) ====================
    async function addPointsToUser(uid, amount, reason) {
        if (!uid || !amount) return false;
        try {
            await usersRef.child(uid).child('balance').transaction(c => (c || 0) + amount);
            await pointLogsRef.child(uid).push({ amount, reason: reason || 'system', timestamp: Date.now() });
            return true;
        } catch(e) { console.error('addPoints:', e); return false; }
    }

    async function deductPointsFromUser(uid, amount, reason) {
        if (!uid || !amount) return false;
        let success = false;
        await usersRef.child(uid).child('balance').transaction(c => {
            const cur = c || 0;
            if (cur < amount) { success = false; return cur; }
            success = true;
            return cur - amount;
        });
        if (success) {
            await pointLogsRef.child(uid).push({ amount: -amount, reason: reason || 'system', timestamp: Date.now() });
        }
        return success;
    }

    async function executeTransaction(item, isPrompt) {
        if (!currentUser) return { ok: true, earned: 0, reason: 'guest' };
        
        const ps = getPointSettings();
        const isOwn = item.uploadedBy === currentUser.uid;
        const isAdminOwner = !item.uploadedBy || item.uploadedBy === 'admin';
        
        if (isOwn) return { ok: true, earned: 0, reason: 'own_content' };
        
        const txKey = 'tx_' + currentUser.uid + '_' + item.id;
        if (localStorage.getItem(txKey)) return { ok: true, earned: 0, reason: 'already_processed' };
        
        let earned = 0;
        
        // ⭐ 1. Give Download Income to current user (Downloader/Copier)
        let downloadIncome = isPrompt ? ps.promptDownloadReward : ps.downloadReward;

        if (downloadIncome > 0) {
            const success = await addPointsToUser(
                currentUser.uid, 
                downloadIncome, 
                (isPrompt ? 'earned_from_prompt:' : 'earned_from_download:') + item.id
            );
            if (success) earned += downloadIncome;
        }
        
        // ⭐ 2. Reward Uploader (Not affecting display anymore, just backend logic)
        if (!isAdminOwner && ps.uploaderEarnsOnDownload) {
            let reward;
            if (isPrompt) {
                reward = (item.uploaderPoints !== undefined && item.uploaderPoints !== null) ? Number(item.uploaderPoints) : ps.promptUploaderReward;
            } else {
                reward = (item.uploaderPoints !== undefined && item.uploaderPoints !== null) ? Number(item.uploaderPoints) : ps.uploaderReward;
            }
            
            if (reward > 0) {
                await addPointsToUser(
                    item.uploadedBy, 
                    reward, 
                    (isPrompt ? 'prompt_copied_by:' : 'downloaded_by:') + currentUser.uid + ':' + item.id
                );
            }
        }
        
        localStorage.setItem(txKey, '1');
        return { ok: true, earned, reason: 'success' };
    }

    function getAIPromptFiles() {
        const imgSettings = appSettings.aiImage || {};
        if (imgSettings.enabled === false) return [];
        const adminPrompts = (imgSettings.prompts || []).map((p, i) => ({
            id: 'ai-prompt-' + i,
            title: p.title || ('AI Prompt ' + (i + 1)),
            thumbnail_url: p.sample_image || '',
            file_extension: '.ai',
            required_ads: parseInt(p.required_ads) || 0,
            status: 'approved',
            isAIPrompt: true,
            promptIndex: i,
            prompt_text: p.prompt || '',
            detail_photos: p.detail_photos || [],
            created_at: p.created_at || Date.now(),
            uploadedBy: 'admin',
            uploaderPoints: p.uploaderPoints !== undefined ? p.uploaderPoints : undefined
        }));
        const userPrompts = allFiles
            .filter(f => f.isPromptUpload === true && f.status === 'approved')
            .map(f => ({ ...f, isAIPrompt: true, prompt_text: f.prompt_text || f.description || '' }));
        return adminPrompts.concat(userPrompts);
    }

    // ==================== AUTH ====================
    auth.onAuthStateChanged(async user => {
        if (user && !user.isAnonymous) {
            currentUser = user;
            try {
                const snap = await usersRef.child(user.uid).once('value');
                currentUserData = snap.val() || {};
                if (!currentUserData.numericId) {
                    const nid = Math.floor(1000000000 + Math.random() * 9000000000).toString();

                    localStorage.setItem('theme', currentUserData.theme);

            if (userDataListener) { userDataListener.off(); userDataListener = null; }

        handleRoute();

    function showAuthModal() {
        document.getElementById('authModalContent').innerHTML = 
            '<div>' +
                '<h1 class="modal-title" style="text-align:center; font-size:1.8rem; background: linear-gradient(135deg, var(--primary), #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Welcome to FileHub</h1>' +
                '<p style="text-align:center;color:var(--text-sub);margin-bottom:28px;">Secure file storage & sharing</p>' +
                '<div class="auth-tabs">' +
                    '<div class="auth-tab active" onclick="switchAuthTab(\'login\',event)">Login</div>' +
                    '<div class="auth-tab" onclick="switchAuthTab(\'register\',event)">Register</div>' +
                '</div>' +
                '<div id="authAlert" class="alert hidden"></div>' +
                '<form id="authForm">' +
                    '<div id="registerFields" class="hidden">' +
                        '<div class="form-group"><label class="form-label">Full Name</label><input type="text" id="regFullName" class="form-control"></div>' +
                        '<div class="form-group"><label class="form-label">Username</label><input type="text" id="regUsername" class="form-control"></div>' +
                    '</div>' +
                    '<div class="form-group"><label class="form-label">Email</label><input type="email" id="authEmail" class="form-control" required></div>' +
                    '<div class="form-group"><label class="form-label">Password</label><input type="password" id="authPassword" class="form-control" required></div>' +
                    '<button type="submit" class="btn btn-primary" id="authBtn">Login</button>' +
                '</form>' +
            '</div>';
        document.getElementById('authForm').addEventListener('submit', handleAuth);
        openModal('authModal');
    }
    
    window.switchAuthTab = (tab, e) => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        if (e && e.target) e.target.classList.add('active');
        const reg = document.getElementById('registerFields');
        const btn = document.getElementById('authBtn');
        if (tab === 'register') { reg.classList.remove('hidden'); btn.innerText = 'Register'; }
        else { reg.classList.add('hidden'); btn.innerText = 'Login'; }
    };
    
    async function handleAuth(e) {
        e.preventDefault();
        const isLogin = document.getElementById('registerFields').classList.contains('hidden');
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        const btn = document.getElementById('authBtn');
        btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
        try {
            if (isLogin) {
                await auth.signInWithEmailAndPassword(email, password);
                showAuthAlert('Login successful!', 'success');
                setTimeout(() => { closeModal('authModal'); navigateTo('/'); }, 1200);
            } else {
                const fullname = document.getElementById('regFullName').value;
                const username = document.getElementById('regUsername').value;
                if (!fullname || !username) throw new Error('Fill all fields');
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                const numericId = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                const regBonus = (appSettings.app && Number(appSettings.app.registrationBonus)) || 0;
                await usersRef.child(cred.user.uid).set({
                    email, fullname, username, numericId,
                    isAccountActive: true, balance: regBonus, adsWatched: 0,
                    createdAt: Date.now(), theme: 'light'
                });
                if (regBonus > 0) {
                    await pointLogsRef.child(cred.user.uid).push({ amount: regBonus, reason: 'registration_bonus', timestamp: Date.now() });
                }
                showAuthAlert('Registered! আপনি ' + regBonus + ' পয়েন্ট পেয়েছেন।', 'success');
                setTimeout(() => { closeModal('authModal'); navigateTo('/'); }, 1500);
            }
        } catch(err) {
            showAuthAlert(err.message, 'error');
            btn.disabled = false; btn.innerText = isLogin ? 'Login' : 'Register';
        }
    }
    
    function showAuthAlert(msg, type) {
        const el = document.getElementById('authAlert');
        el.textContent = msg; el.className = 'alert alert-' + type; el.classList.remove('hidden');
    }

    // ==================== DATA LOADING ====================
    async function loadData() {
        if (dataLoaded) return;
        if (dataLoadingPromise) return dataLoadingPromise;
        
        dataLoadingPromise = (async () => {
            try {
                const [filesSnap, bannersSnap, settingsSnap] = await Promise.all([
                    filesRef.once('value'),
                    bannersRef.once('value'),
                    settingsRef.once('value')
                ]);
                allFiles = filesSnap.val() ? Object.entries(filesSnap.val()).map(([id, d]) => ({ id, ...d })) : [];
                allBanners = bannersSnap.val() ? Object.entries(bannersSnap.val()).map(([id, d]) => ({ id, ...d })) : [];
                appSettings = settingsSnap.val() || {};
                AD_REQUIRED_SECONDS = getAdSeconds();
                dataLoaded = true;
                
                const noticeText = (appSettings.app && appSettings.app.scrollingNotice) || '';
                const noticeContainer = document.getElementById('scrolling-notice-container');
                if (noticeText) {
                    noticeContainer.classList.remove('hidden');
                    document.getElementById('scrolling-notice-text').innerText = noticeText;
                } else {
                    noticeContainer.classList.add('hidden');
                }
            } catch(e) { console.error('loadData:', e); }
        })();
        return dataLoadingPromise;
    }

    // ==================== NOTIFICATIONS ====================
    function loadNotifications() {
        if (!currentUser) return;
        if (notifListener) notifListener.off();
        notifListener = notificationsRef.orderByChild('created_at').limitToLast(50);
        notifListener.on('value', snap => {
            allNotifications = snap.val() 
                ? Object.entries(snap.val()).map(([id, d]) => ({ id, ...d }))
                    .filter(n => !n.target_uid || n.target_uid === 'all' || n.target_uid === currentUser.uid)
                    .sort((a, b) => b.created_at - a.created_at)
                : [];
            updateBadge();
            if (notifSheet.classList.contains('active') && !isNotifInDetail) renderNotifications();
        });
    }
    function updateBadge() {
        const unread = allNotifications.filter(n => !n.is_read).length;
        notifBadge.innerText = unread > 99 ? '99+' : unread;
        notifBadge.classList.toggle('active', unread > 0);
    }
    function renderNotifications() {
        notifListView.classList.remove('hidden');
        notifDetailView.classList.add('hidden');
        isNotifInDetail = false;
        updateNotifLeftIcon();
        if (allNotifications.length === 0) {
            notifList.innerHTML = '<li class="empty-state"><i class="fas fa-bell-slash"></i>No notifications.</li>';
            return;
        }
        notifList.innerHTML = allNotifications.map(n => 
            '<li class="notif-item ' + (n.is_read ? '' : 'unread') + '" onclick="openNotifDetail(\'' + n.id + '\')">' +
                '<div class="notif-title-list">' + escapeHtmlUser(n.title || 'Notification') + '</div>' +
                '<div class="notif-time">' + timeAgoShort(n.created_at) + '</div>' +
            '</li>'
        ).join('');
    }
    window.openNotifDetail = async (nid) => {
        const n = allNotifications.find(x => x.id === nid);
        if (!n) return;
        notifListView.classList.add('hidden');
        notifDetailView.classList.remove('hidden');
        isNotifInDetail = true;
        updateNotifLeftIcon();
        const html = DOMPurify.sanitize(marked.parse(n.decs || n.description || ''));
        notifDetailContent.innerHTML = 
            '<h2 style="margin-bottom:8px; font-family:Outfit; font-size:1.4rem;">' + escapeHtmlUser(n.title || '') + '</h2>' +
            '<div style="color:var(--text-sub);font-size:.85rem;margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:10px;">' + timeAgoShort(n.created_at) + '</div>' +
            '<div>' + html + '</div>';
        if (!n.is_read && currentUser) await notificationsRef.child(nid).update({ is_read: true }).catch(()=>{});
    };
    window.closeNotifDetail = () => {

    function getFileIconForExt(ext) {
        const e = String(ext || '').toLowerCase().replace('.', '');
        if (e === 'apk') return 'fa-android';
        if (e === 'zip' || e === 'rar' || e === '7z') return 'fa-file-zipper';
        if (e === 'pdf') return 'fa-file-pdf';
        if (e === 'mp4' || e === 'mkv' || e === 'avi') return 'fa-video';
        if (e === 'mp3' || e === 'wav') return 'fa-music';
        if (e === 'jpg' || e === 'png' || e === 'gif' || e === 'webp') return 'fa-image';
        if (e === 'ai') return 'fa-wand-magic-sparkles';
        if (e === 'exe') return 'fa-laptop-code';
        if (e === 'html' || e === 'php' || e === 'js' || e === 'css') return 'fa-code';
        return 'fa-file';
    }

    function renderAIFileButton(id, title, ext, type) {
        const icon = getFileIconForExt(ext);
        const safeId = String(id).replace(/[^a-zA-Z0-9-_]/g, '');
        const safeTitle = escapeHtmlUser(title);
        const safeExt = escapeHtmlUser(ext).replace(/[^a-zA-Z0-9.]/g, '');
        return '<div class="ai-file-btn" data-file-id="' + safeId + '" data-file-ext="' + safeExt + '" data-file-type="' + (type || 'file') + '" role="button" tabindex="0">' +
            '<div class="ai-file-btn-icon"><i class="fas ' + icon + '"></i></div>' +
            '<div class="ai-file-btn-info">' +
                '<div class="ai-file-btn-title">' + safeTitle + '</div>' +
                '<div class="ai-file-btn-meta">' +
                    '<span class="ai-file-btn-ext">' + safeExt + '</span>' +
                    '<span class="ai-file-btn-cta" style="color:var(--primary);font-size:0.75rem;font-weight:700;">Open →</span>' +
                '</div>' +
            '</div>' +
            '<div class="ai-file-btn-arrow"><i class="fas fa-chevron-right"></i></div>' +
        '</div>';
    }

    function processAIFileLinks(text) {
        if (!text) return '';
        return text.replace(/\[FILE:([^|\]]+)\|([^|\]]+)\|([^\]]+)\]/g, (m, id, title, ext) => {
            return '\n\n' + renderAIFileButton(id.trim(), title.trim(), ext.trim(), 'file') + '\n\n';
        });
    }

    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'chat-bubble ' + role;
        if (role === 'ai') {
            const processed = processAIFileLinks(text || '');
            const parsed = DOMPurify.sanitize(marked.parse(processed), {
                ADD_ATTR: ['data-file-id', 'data-file-ext', 'data-file-type', 'target', 'role', 'tabindex']
            });
            div.innerHTML = '<img src="https://iili.io/fYWPWg9.jpg" class="ai-avatar"><div class="ai-content">' + parsed + '</div>';
            setTimeout(() => {
                div.querySelectorAll('.ai-file-btn').forEach(card => {
                    const goTo = () => {
                        const fid = card.dataset.fileId;
                        closeSheetCommon();
                        setTimeout(() => navigateTo('/file/' + fid), 350);
                    };
                    card.addEventListener('click', goTo);
                });
            }, 50);
        } else div.innerText = text;
        chatList.appendChild(div);
        chatList.scrollTop = chatList.scrollHeight;
    }
    
    function showTyping() {
        const div = document.createElement('div');
        div.id = 'typingIndicator';
        div.innerHTML = '<div class="chat-bubble ai" style="padding:12px 18px;"><span><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></span></div>';
        chatList.appendChild(div);
        chatList.scrollTop = chatList.scrollHeight;
    }
    function removeTyping() { const el = document.getElementById('typingIndicator'); if (el) el.remove(); }

    chatSendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    chatInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px'; });

    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;
        chatInput.value = ''; chatInput.style.height = 'auto';
        appendMessage('user', text);
        showTyping();
        try {
            if (currentUser) await chatsRef.push({ userId: currentUser.uid, role: 'user', content: text, timestamp: Date.now() });
            
            const aiSettings = appSettings.ai || {};
            const apiKey = aiSettings.apiKey || '';
            const apiUrl = aiSettings.apiURL || 'https://api.openai.com/v1/chat/completions';
            const apiModel = aiSettings.model || 'gpt-4o-mini';
            
            if (!apiKey) {
                removeTyping();
                appendMessage('ai', '⚠️ **AI API Key সেট করা হয়নি।** এডমিন প্যানেল থেকে সেট করুন।');
                return;
            }

            const approvedFiles = allFiles.filter(f => f.status === 'approved' && !f.isPromptUpload);
            const apkFiles = approvedFiles.filter(f => (f.file_extension||'').toLowerCase().replace('.','') === 'apk');
            const otherFiles = approvedFiles.filter(f => (f.file_extension||'').toLowerCase().replace('.','') !== 'apk');
            const aiPrompts = getAIPromptFiles();
            
            const websiteName = (appSettings.app && appSettings.app.appName) || 'FileHub';
            const adminInfo = appSettings.admin || {};
            const adminName = adminInfo.name || 'FileHub Admin';
            const adminSocial = adminInfo.social || {};
            const socialList = [];
            if (adminSocial.telegram) socialList.push('Telegram: ' + adminSocial.telegram);
            if (adminSocial.facebook) socialList.push('Facebook: ' + adminSocial.facebook);
            if (adminSocial.youtube) socialList.push('YouTube: ' + adminSocial.youtube);
            if (adminSocial.whatsapp) socialList.push('WhatsApp: ' + adminSocial.whatsapp);
            if (adminSocial.instagram) socialList.push('Instagram: ' + adminSocial.instagram);
            if (adminSocial.twitter) socialList.push('Twitter: ' + adminSocial.twitter);
            if (adminSocial.email) socialList.push('Email: ' + adminSocial.email);
            const socialText = socialList.length > 0 ? socialList.join('\n') : 'Telegram: https://t.me/yourusername';

            const systemPrompt = 
                "You are FileHub AI — the official website assistant.\n\n" +
                "🌐 **You can answer ANY question** — both about this website AND anything else the user asks.\n" +
                "For general topics (math, science, coding, history, sports, news, recipes), answer fully.\n" +
                "For website topics (files, prompts, admin, downloads, points), use data below.\n\n" +
                "=== LANGUAGE ===\n" +
                "Reply in Bengali (বাংলা) by default. Be friendly, use emojis.\n\n" +
                "=== ABOUT YOU ===\n" +
                "You are " + websiteName + "'s AI assistant. Created by " + adminName + ".\n" +
                "Admin social: " + socialText + "\n\n" +
                "=== WEBSITE ===\n" +
                "Name: " + websiteName + " | APK: " + apkFiles.length + " | Files: " + otherFiles.length + " | Prompts: " + aiPrompts.length + "\n\n" +
                "=== APK FILES ===\n" + JSON.stringify(apkFiles.map(f => ({ id: f.id, title: f.title, ext: f.file_extension }))) + "\n\n" +
                "=== OTHER FILES ===\n" + JSON.stringify(otherFiles.map(f => ({ id: f.id, title: f.title, ext: f.file_extension }))) + "\n\n" +
                "=== AI PROMPTS ===\n" + JSON.stringify(aiPrompts.map(f => ({ id: f.id, title: f.title, ext: '.ai' }))) + "\n\n" +
                "=== FILE FORMAT ===\n" +
                "Use EXACTLY: [FILE:id|Title|.ext] — system converts to buttons.\n\n" +
                "=== USER ===\n" +
                "Name: " + (currentUserData ? (currentUserData.fullname || 'Guest') : 'Guest') + " | Points: " + ((currentUserData && currentUserData.balance) || 0);

            const res = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                body: JSON.stringify({
                    model: apiModel,
                    messages: [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: text }
                    ],
                    temperature: 0.8
                })
            });
            const data = await res.json();
            removeTyping();
            if (data.choices && data.choices[0]) {
                const reply = data.choices[0].message.content;
                appendMessage('ai', reply);
                if (currentUser) await chatsRef.push({ userId: currentUser.uid, role: 'ai', content: reply, timestamp: Date.now() });
            } else {
                appendMessage('ai', '⚠️ ' + ((data.error && data.error.message) || 'API error'));
            }
        } catch(e) { removeTyping(); appendMessage('ai', '⚠️ ' + e.message); }
    }

    // ==================== ROUTING ====================
    async function handleRoute() {
        let path = currentRoute || window.location.hash.substring(1) || '/';
        if (path.length > 1 && path.endsWith('/')) path = path.slice(0, -1);
        if (!path) path = '/';

        clearInterval(bannerInterval); clearInterval(detailInterval);

        if (path === '/' || path === '/index.html') {
            if (!dataLoaded) {
                renderHomeSkeleton();
                loadData().then(() => {
                    const siteClosed = appSettings.app && appSettings.app.siteClosed === true;
                    if (siteClosed && !isAdminUser()) { renderClosed(); return; }
                    renderHome();
                });
            } else {
                const siteClosed = appSettings.app && appSettings.app.siteClosed === true;
                if (siteClosed && !isAdminUser()) { renderClosed(); return; }
                renderHome();
            }
        } else if (path.indexOf('/file/') === 0) {
            const id = decodeURIComponent(path.split('/file/')[1]);
            if (!dataLoaded) {
                renderDetailSkeleton();
                loadData().then(() => {
                    const siteClosed = appSettings.app && appSettings.app.siteClosed === true;
                    if (siteClosed && !isAdminUser()) { renderClosed(); return; }
                    renderDetail(id);
                });
            } else {
                const siteClosed = appSettings.app && appSettings.app.siteClosed === true;
                if (siteClosed && !isAdminUser()) { renderClosed(); return; }
                renderDetail(id);
            }
        } else if (path.indexOf('/banner/') === 0) {
            const id = path.split('/banner/')[1];
            if (!dataLoaded) {
                renderDetailSkeleton();
                loadData().then(() => renderBannerDetail(id));
            } else {
                renderBannerDetail(id);
            }
        } else if (path === '/upload') {
            if (!dataLoaded) {
                loadData().then(() => { currentUser ? renderUpload() : (showAuthModal(), renderHome()); });
            } else {
                currentUser ? renderUpload() : (showAuthModal(), renderHome());
            }
        } else if (path === '/profile') {
            if (!dataLoaded) {
                loadData().then(() => { currentUser ? renderProfile() : (showAuthModal(), renderHome()); });
            } else {
                currentUser ? renderProfile() : (showAuthModal(), renderHome());
            }
        } else {
            renderHome();
        }
    }

    function isAdminUser() {
        const adminUids = (appSettings.admin && appSettings.admin.uids) || [];
        return currentUser && adminUids.includes(currentUser.uid);
    }

        const badge = isAI ? '<span class="prompt-file-badge">' + cssEmoji('magic') + ' AI Prompt</span>'

    // ==================== MARKDOWN ====================
    function renderMarkdown(text) {
        if (!text || !text.trim()) {
            return '<div class="detail-desc empty">— No description available —</div>';
        }
        try {
            marked.setOptions({ breaks: true, gfm: true });
            let html = marked.parse(text);
            html = DOMPurify.sanitize(html, {
                ADD_TAGS: ['iframe'],
                ADD_ATTR: ['target', 'rel', 'loading', 'allowfullscreen', 'frameborder']
            });
            html = html.replace(/<a\s+([^>]*?)>/gi, function(match, attrs) {
                if (attrs.indexOf('target=') === -1) return '<a ' + attrs + ' target="_blank" rel="noopener noreferrer">';
                return match;
            });
            html = html.replace(/<img\s+([^>]*?)>/gi, function(match, attrs) {
                if (attrs.indexOf('loading=') === -1) attrs += ' loading="lazy"';
                return '<img ' + attrs + ' onclick="openLightbox(this.src)" style="cursor: zoom-in;">';
            });
            return '<div class="detail-desc">' + html + '</div>';
        } catch (e) {
            return '<div class="detail-desc empty">Failed to render description</div>';
        }
    }

    // ==================== DETAIL ====================
    async function renderDetail(id) {

        const aiPrompt = aiPrompts.find(p => p.id === id);
        if (aiPrompt) {
            document.title = aiPrompt.title + ' - FileHub';
            await renderDetailPage('prompt', aiPrompt);
            return;
        }

        const snap = await filesRef.child(id).once('value');
        if (!snap.exists()) { renderError('Not Found', 'The content does not exist.'); return; }
        const item = { id, ...snap.val() };
        document.title = (item.title || 'File') + ' - FileHub';
        await renderDetailPage('file', item);
    }

            '<h1 class="detail-title">' + escapeHtmlUser(item.title || 'Untitled') + '</h1>' +
            '<div class="detail-meta-grid">' +

    async function handleDownload(type, item, btnEl) {
        const statusEl = document.getElementById('dlStatus');
        if (!item.download_url) { 
            if (statusEl) statusEl.innerText = 'Download URL missing.'; 
            return; 
        }
        
        const isPrompt = type === 'prompt' || item.isPromptUpload === true;
        
        const tx = await executeTransaction(item, isPrompt);
        
        if (tx.earned > 0) {
            showToast('✅ আপনি +' + tx.earned + ' পয়েন্ট পেয়েছেন!', 'success');
            if (statusEl) statusEl.innerHTML = '✅ আপনি +' + tx.earned + ' পয়েন্ট পেয়েছেন!';
        } else if (tx.reason === 'own_content') {
            if (statusEl) statusEl.innerHTML = '✅ নিজের ফাইল — কোনো ট্রানজ্যাকশন নেই';
        }
        
        if (btnEl) { btnEl.innerText = 'Redirecting...'; btnEl.disabled = true; }
        try {
            await filesRef.child(item.id).child('total_downloads').transaction(c => (c || 0) + 1);
        } catch(e) {}
        window.location.href = item.download_url;
    }

    async function executePromptTransaction(item) {
        const tx = await executeTransaction(item, true);
        
        if (tx.earned > 0) {
            showToast('✅ Prompt ready! আপনি +' + tx.earned + ' পয়েন্ট পেয়েছেন!', 'success');

    window.copyMainPrompt = function(btn) {
        const box = document.getElementById('promptTextBox');
        if (!box) return;
        const txt = box.textContent;
        
        const doCopy = () => {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(txt);
            } else {
                return new Promise((resolve, reject) => {
                    const temp = document.createElement('textarea');
                    temp.value = txt;
                    temp.style.position = 'fixed';
                    temp.style.opacity = '0';
                    document.body.appendChild(temp);
                    temp.select();
                    try { document.execCommand('copy'); resolve(); }
                    catch (e) { reject(e); }
                    document.body.removeChild(temp);
                });
            }
        };
        
        doCopy().then(() => {
            const orig = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            btn.classList.add('copied');
            showToast('✅ Prompt copied! Gemini AI-তে paste করুন', 'success');
            setTimeout(() => {
                btn.innerHTML = orig;
                btn.classList.remove('copied');
            }, 2000);
        }).catch(() => {
            showToast('❌ Copy failed. ম্যানুয়ালি কপি করুন।', 'error');
        });
    };

    window.sharePrompt = async function(btn, url, title) {
        const shareData = {
            title: title + ' - FileHub',
            text: 'দেখুন: ' + title + ' — FileHub থেকে',
            url: url
        };
        
        try {
            if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
                await navigator.share(shareData);
                showToast('✅ Shared successfully!', 'success');
            } else if (navigator.share) {
                await navigator.share(shareData);
                showToast('✅ Shared successfully!', 'success');
            } else {
                await navigator.clipboard.writeText(url);
                showToast('🔗 Link copied! এখন শেয়ার করুন', 'info');
                const orig = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Link Copied!';
                setTimeout(() => { btn.innerHTML = orig; }, 2000);
            }
        } catch (err) {
            if (err.name !== 'AbortError') {
                try {
                    await navigator.clipboard.writeText(url);
                    showToast('🔗 Link copied!', 'info');
                } catch(e) {
                    showToast('❌ Share failed', 'error');
                }
            }
        }
    };

    function showToast(message, type) {
        const existing = document.getElementById('appToast');

        const toast = document.createElement('div');
        toast.id = 'appToast';
        toast.className = 'copy-toast' + (type === 'info' ? ' share-toast' : '');

    window.openAdsterraLink = function() {
        const adLink = (appSettings.ads && appSettings.ads.adsterraDirectLink) || '';
        if (!adLink) return;
        AD_REQUIRED_SECONDS = getAdSeconds();
        adPopupBtn.disabled = true;
        adPopupBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Opening...';
        adWarning.classList.add('show');
        const w = window.open(adLink, '_blank');
        if (!w || w.closed) {
            adPopupStatus.textContent = 'Popup blocked!';
            adPopupBtn.disabled = false; adPopupBtn.innerHTML = 'Try Again';
            return;
        }
        adWindowOpened = true; adSecondsElapsed = 0;
        adTimerDisplay.style.display = 'block';
        adTimerDisplay.textContent = AD_REQUIRED_SECONDS;
        adProgressBar.style.display = 'block';
        let remaining = AD_REQUIRED_SECONDS;
        adTimerInterval = setInterval(() => {
            remaining--; adSecondsElapsed++;
            if (remaining > 0) {
                adTimerDisplay.textContent = remaining;
                adProgressFill.style.width = ((AD_REQUIRED_SECONDS - remaining) / AD_REQUIRED_SECONDS * 100) + '%';
                adPopupStatus.textContent = '⏳ ' + remaining + ' সেকেন্ড বাকি...';
            } else {
                adTimerDisplay.textContent = '0';
                adProgressFill.style.width = '100%';
                clearInterval(adTimerInterval);
                adPopupStatus.textContent = '✅ সম্পূর্ণ!';
                completeAdUnlock();
            }
        }, 1000);
        adCheckInterval = setInterval(() => {
            try {
                if (w.closed && !adUnlockCompleted && adSecondsElapsed < AD_REQUIRED_SECONDS) {
                    clearInterval(adCheckInterval);
                    clearInterval(adTimerInterval);
                    adWarning.classList.add('show');
                    adWarning.innerHTML = AD_REQUIRED_SECONDS + ' সেকেন্ডের আগে বন্ধ করেছেন!';
                    adPopupBtn.disabled = false;
                    adPopupBtn.innerHTML = '<i class="fas fa-redo"></i> Try Again';
                    adTimerDisplay.style.display = 'none';
                    adProgressBar.style.display = 'none';
                    adWindowOpened = false;
                }
            } catch(e) {}
        }, 500);
    };

    async function completeAdUnlock() {
        if (adUnlockCompleted) return;
        adUnlockCompleted = true;
        if (!pendingAdFileId) return;
        
        clearInterval(adTimerInterval); 
        clearInterval(adCheckInterval);
        adPopupBtn.disabled = true;
        adPopupBtn.innerHTML = '<i class="fas fa-check-circle"></i> Unlocking...';
        
        try {
            const newWatched = pendingAdCurrentWatched + 1;
            
            if (currentUser) {
                await database.ref('user_file_status/' + currentUser.uid + '_' + pendingAdFileId).set(newWatched);
                await usersRef.child(currentUser.uid).child('adsWatched').transaction(c => (c || 0) + 1);
            } else {
                localStorage.setItem('ad_' + pendingAdFileId, newWatched);
            }
            
            const allDone = newWatched >= pendingAdReq;
            
            if (allDone && pendingAdType === 'prompt') {
                const aiPrompts = getAIPromptFiles();
                const promptItem = aiPrompts.find(p => p.id === pendingAdFileId);
                if (promptItem && currentUser) {
                    await executePromptTransaction(promptItem);
                }
            } else if (allDone && pendingAdType === 'file') {
                showToast('✅ সব Step সম্পূর্ণ! এখন Download করুন', 'success');
            } else {
                showToast('✅ Step ' + newWatched + '/' + pendingAdReq + ' সম্পূর্ণ!', 'success');
            }
            
            adPopupBtn.innerHTML = '<i class="fas fa-check-circle"></i> Unlocked!';
        } catch(e) {
            console.error('completeAdUnlock:', e);
            showToast('❌ ' + e.message, 'error');
        }
        
        setTimeout(() => { closeAdPopup(); handleRoute(); }, 1400);
    }

        if (adTimerInterval) clearInterval(adTimerInterval);

    };

    function initCarousel(innerId, dotsId, count, isHome) {
        const inner = document.getElementById(innerId);
        const dots = document.getElementById(dotsId) ? document.getElementById(dotsId).children : null;
        if (!inner || !dots) return;
        let idx = 0, interval;
        function update() {
            inner.style.transform = 'translateX(-' + (idx * 100) + '%)';
            for (let i = 0; i < dots.length; i++) dots[i].classList.remove('active');
            if (dots[idx]) dots[idx].classList.add('active');
        }
        function next() { idx = (idx + 1) % count; update(); }
        function prev() { idx = (idx - 1 + count) % count; update(); }
        interval = setInterval(next, 5000);
        if (isHome) bannerInterval = interval; else detailInterval = interval;
        let sX = 0, eX = 0;
        inner.addEventListener('touchstart', e => { sX = e.changedTouches[0].screenX; clearInterval(interval); }, {passive:true});
        inner.addEventListener('touchend', e => { eX = e.changedTouches[0].screenX; if (eX < sX - 50) next(); if (eX > sX + 50) prev(); interval = setInterval(next, 5000); }, {passive:true});
    }
