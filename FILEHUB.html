<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FileHub Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
<style>
:root{--primary:#6366f1;--primary-2:#8b5cf6;--primary-3:#ec4899;--primary-soft:#eef2ff;--primary-glow:rgba(99,102,241,.4);--accent:#f59e0b;--success:#10b981;--danger:#ef4444;--bg:#f8fafc;--bg-2:#eef2ff;--surface:#fff;--text-main:#0f172a;--text-sub:#64748b;--text-mute:#94a3b8;--border:#e2e8f0;--border-soft:#f1f5f9;--shadow-xs:0 1px 2px rgba(15,23,42,.04);--shadow-sm:0 2px 8px rgba(15,23,42,.06);--shadow-md:0 8px 24px rgba(15,23,42,.08);--shadow-lg:0 20px 50px rgba(15,23,42,.12);--shadow-glow:0 8px 24px rgba(99,102,241,.35)}
[data-theme="dark"]{--primary:#818cf8;--primary-2:#a78bfa;--primary-3:#f472b6;--primary-soft:#1e293b;--primary-glow:rgba(129,140,248,.4);--bg:#0b1120;--bg-2:#0f172a;--surface:#1e293b;--text-main:#f8fafc;--text-sub:#94a3b8;--text-mute:#64748b;--border:#334155;--border-soft:#1e293b;--shadow-xs:0 1px 2px rgba(0,0,0,.3);--shadow-sm:0 2px 8px rgba(0,0,0,.4);--shadow-md:0 8px 24px rgba(0,0,0,.5);--shadow-lg:0 20px 50px rgba(0,0,0,.6)}
*{box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-main);min-height:100vh;margin:0;transition:background .3s,color .3s}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;letter-spacing:-.3px;margin-top:0}
h1{font-size:1.75rem;font-weight:700}h2{font-size:1.3rem;font-weight:700}h3{font-size:1.1rem;font-weight:700}
.sidebar{width:270px;background:var(--surface);border-right:1px solid var(--border-soft);padding:20px;position:fixed;top:0;left:-270px;height:100vh;z-index:1000;transition:left .35s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:flex;flex-direction:column}
.sidebar.open{left:0}
@media(min-width:768px){.sidebar{left:0}.main-content{margin-left:270px}}
.sidebar-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);z-index:999;display:none}
.sidebar-overlay.active{display:block}
.sidebar-header{display:flex;align-items:center;gap:10px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border-soft)}
.sidebar-logo{width:42px;height:42px;border-radius:14px;object-fit:cover;box-shadow:var(--shadow-sm),0 0 0 2px var(--primary-soft)}
.sidebar-title{font-family:'Space Grotesk',sans-serif;font-size:1.25rem;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--primary-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.nav-section{font-size:.7rem;font-weight:700;color:var(--text-mute);text-transform:uppercase;letter-spacing:1px;padding:12px 15px 6px}
.nav-link{display:flex;align-items:center;gap:12px;padding:11px 15px;border-radius:12px;color:var(--text-sub);font-weight:500;transition:all .2s;margin-bottom:4px;cursor:pointer;font-size:.92rem;user-select:none}
.nav-link:hover{background:var(--primary-soft);color:var(--primary)}
.nav-link.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:white;box-shadow:0 4px 16px var(--primary-glow)}
.nav-link i{width:20px;text-align:center;font-size:1rem}
.nav-badge{margin-left:auto;background:var(--danger);color:white;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:10px;min-width:20px;text-align:center}
.nav-link.active .nav-badge{background:rgba(255,255,255,.3)}
.main-content{padding:24px;min-height:100vh;transition:margin-left .3s}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-size:1.6rem;font-weight:700;display:flex;align-items:center;gap:12px}
.page-title-icon{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:flex;align-items:center;justify-content:center;color:white;font-size:1.1rem;box-shadow:var(--shadow-glow)}
.card{background:var(--surface);border-radius:18px;padding:22px;box-shadow:var(--shadow-sm);border:1px solid var(--border-soft);margin-bottom:20px}
.card-title{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:700;margin:0 0 16px;display:flex;align-items:center;gap:10px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:var(--surface);border-radius:18px;padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border-soft);position:relative;overflow:hidden;transition:all .25s}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:100px;height:100px;background:radial-gradient(circle at top right,var(--primary-soft),transparent 70%);opacity:.5}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--primary)}
.stat-icon-wrap{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:12px;position:relative;z-index:1;box-shadow:var(--shadow-sm)}
.stat-icon-wrap.blue{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white}
.stat-icon-wrap.yellow{background:linear-gradient(135deg,#f59e0b,#f97316);color:white}
.stat-icon-wrap.green{background:linear-gradient(135deg,#10b981,#34d399);color:white}
.stat-icon-wrap.pink{background:linear-gradient(135deg,#ec4899,#f472b6);color:white}
.stat-value{font-family:'Space Grotesk',sans-serif;font-size:1.9rem;font-weight:700;line-height:1;margin-bottom:4px;position:relative;z-index:1}
.stat-label{font-size:.8rem;color:var(--text-sub);text-transform:uppercase;letter-spacing:.5px;font-weight:600;position:relative;z-index:1}
.alert-banner{border-radius:16px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.alert-banner.warn{background:linear-gradient(135deg,#fef3c7,#fde68a);border-left:4px solid var(--accent);color:#78350f}
.alert-banner.info{background:linear-gradient(135deg,#dbeafe,#bfdbfe);border-left:4px solid #3b82f6;color:#1e40af}
.alert-banner.success{background:linear-gradient(135deg,#d1fae5,#a7f3d0);border-left:4px solid var(--success);color:#065f46}
.alert-banner.danger{background:linear-gradient(135deg,#fee2e2,#fecaca);border-left:4px solid var(--danger);color:#991b1b}
.alert-banner-icon{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.alert-banner-content{flex:1;min-width:200px}
.alert-banner-title{font-weight:700;font-size:.95rem;margin-bottom:2px}
.alert-banner-sub{font-size:.82rem;opacity:.85}
.btn{padding:10px 18px;border-radius:12px;font-weight:600;cursor:pointer;transition:all .2s;border:none;font-size:.88rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:white;box-shadow:0 4px 16px var(--primary-glow)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px var(--primary-glow)}
.btn-danger{background:var(--danger);color:white}
.btn-danger:hover:not(:disabled){background:#dc2626;transform:translateY(-1px)}
.btn-success{background:var(--success);color:white}
.btn-success:hover:not(:disabled){background:#059669;transform:translateY(-1px)}
.btn-warning{background:var(--accent);color:white}
.btn-warning:hover:not(:disabled){background:#d97706;transform:translateY(-1px)}
.btn-ghost{background:var(--bg-2);color:var(--text-main);border:1px solid var(--border)}
.btn-ghost:hover:not(:disabled){background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.btn-sm{padding:6px 12px;font-size:.78rem;border-radius:10px}
.btn-icon{width:36px;height:36px;padding:0;border-radius:10px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-weight:600;margin-bottom:8px;font-size:.86rem;color:var(--text-main)}
.form-input,.form-textarea,.form-select{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text-main);font-family:inherit;font-size:.92rem;transition:all .2s;outline:none}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);background:var(--surface)}
.checkbox-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg-2);border-radius:12px;margin-bottom:16px}
.checkbox-row input[type="checkbox"]{width:20px;height:20px;accent-color:var(--primary);cursor:pointer}
.checkbox-row label{margin:0;cursor:pointer;font-weight:600}
.table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--border-soft)}
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;padding:12px 14px;background:var(--bg-2);color:var(--text-sub);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.data-table td{padding:14px;border-bottom:1px solid var(--border-soft);font-size:.88rem;vertical-align:middle}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table tbody tr:hover{background:var(--bg-2)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.badge-approved{background:#d1fae5;color:#065f46}
.badge-pending{background:#fef3c7;color:#92400e}
.badge-rejected{background:#fee2e2;color:#991b1b}
.badge-active{background:#dbeafe;color:#1e40af}
.badge-banned{background:#fee2e2;color:#991b1b}
.badge-points{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#78350f;font-family:'Space Grotesk',sans-serif}
[data-theme="dark"] .badge-approved{background:rgba(16,185,129,.2);color:#6ee7b7}
[data-theme="dark"] .badge-pending{background:rgba(245,158,11,.2);color:#fde68a}
[data-theme="dark"] .badge-rejected{background:rgba(239,68,68,.2);color:#fca5a5}
[data-theme="dark"] .badge-active{background:rgba(59,130,246,.2);color:#93c5fd}
[data-theme="dark"] .badge-banned{background:rgba(239,68,68,.2);color:#fca5a5}
[data-theme="dark"] .badge-points{background:rgba(245,158,11,.2);color:#fde68a}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(8px);z-index:2000;display:none;justify-content:center;align-items:center;padding:20px}
.modal-overlay.active{display:flex}
.modal-box{background:var(--surface);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;border-radius:20px;padding:28px;position:relative;animation:modalIn .35s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow-lg)}
@keyframes modalIn{from{opacity:0;transform:translateY(-40px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-close{position:absolute;top:16px;right:16px;cursor:pointer;font-size:1rem;color:var(--text-sub);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--bg-2);border:none;transition:all .2s}
.modal-close:hover{background:var(--danger);color:white}
.alert{padding:14px 16px;border-radius:12px;margin-bottom:16px;font-size:.88rem;font-weight:500;display:flex;align-items:center;gap:10px}
.alert-success{background:linear-gradient(135deg,#d1fae5,#a7f3d0);color:#065f46;border-left:4px solid var(--success)}
.alert-error{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#991b1b;border-left:4px solid var(--danger)}
.alert-info{background:linear-gradient(135deg,#dbeafe,#bfdbfe);color:#1e40af;border-left:4px solid #3b82f6}
.alert-warn{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#92400e;border-left:4px solid var(--accent)}
.hidden{display:none!important}
.flex{display:flex}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}.items-start{align-items:flex-start}.justify-center{justify-content:center}.justify-between{justify-content:space-between}.justify-end{justify-content:flex-end}
.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.text-center{text-align:center}.text-sm{font-size:.85rem}.text-xs{font-size:.75rem}.text-sub{color:var(--text-sub)}.text-main{color:var(--text-main)}
.font-mono{font-family:'SF Mono',Menlo,monospace}.font-bold{font-weight:700}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.w-full{width:100%}
.mb-2{margin-bottom:8px}.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}.mt-4{margin-top:16px}.ml-auto{margin-left:auto}
.hidden-sm{display:initial}
@media(max-width:640px){.hidden-sm{display:none}.main-content{padding:16px}.page-title{font-size:1.3rem}h1{font-size:1.4rem}}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#ec4899 100%);position:relative;overflow:hidden}
.login-wrap::before,.login-wrap::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.login-wrap::before{width:400px;height:400px;top:-150px;right:-150px}
.login-wrap::after{width:300px;height:300px;bottom:-120px;left:-100px}
.login-card{background:var(--surface);border-radius:24px;padding:36px 30px;max-width:420px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.25);position:relative;z-index:1}
.login-logo{width:80px;height:80px;border-radius:22px;margin:0 auto 16px;display:block;box-shadow:var(--shadow-glow)}
.login-title{text-align:center;font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;margin:0 0 6px;background:linear-gradient(135deg,var(--primary),var(--primary-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.login-subtitle{text-align:center;color:var(--text-sub);font-size:.9rem;margin-bottom:28px}
.method-config-card{background:var(--bg-2);border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid var(--border-soft)}
.thumb-sm{width:56px;height:56px;object-fit:cover;border-radius:10px;border:2px solid var(--border-soft)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-mute)}
</style>
</head>
<body>

<div id="app">
  <div id="login-section" class="login-wrap">
    <div class="login-card">
      <img src="https://iili.io/fY4mez7.jpg" class="login-logo" alt="FileHub">
      <h2 class="login-title">FileHub Admin</h2>
      <p class="login-subtitle">Sign in to control panel</p>
      <div id="login-alert" class="alert hidden"></div>
      <form id="login-form">
        <div class="form-group"><label class="form-label">Email</label><input type="email" id="login-email" class="form-input" placeholder="admin@filehub.com" required></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" id="login-password" class="form-input" placeholder="••••••••" required></div>
        <button type="submit" class="btn btn-primary w-full" id="login-btn" style="width:100%;padding:14px"><i class="fas fa-sign-in-alt"></i> Sign In</button>
      </form>
    </div>
  </div>

  <div id="admin-panel" class="hidden">
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="https://iili.io/fY4mez7.jpg" class="sidebar-logo" alt="FileHub">
        <h1 class="sidebar-title">FileHub Admin</h1>
        <button class="btn btn-ghost btn-icon hidden-md-up" onclick="toggleSidebar()" style="margin-left:auto;display:none"><i class="fas fa-times"></i></button>
      </div>
      <div class="nav-section">Main</div>
      <div class="nav-link active" data-page="dashboard" onclick="loadPage('dashboard')"><i class="fas fa-chart-line"></i> Dashboard</div>
      <div class="nav-link" data-page="files" onclick="loadPage('files')"><i class="fas fa-file-alt"></i> Files <span class="nav-badge hidden" id="files-pending-badge">0</span></div>
      <div class="nav-link" data-page="user-prompts" onclick="loadPage('user-prompts')"><i class="fas fa-wand-magic-sparkles"></i> User Prompts <span class="nav-badge hidden" id="prompts-pending-badge">0</span></div>
      <div class="nav-link" data-page="withdraw" onclick="loadPage('withdraw')"><i class="fas fa-wallet"></i> Withdraw <span class="nav-badge hidden" id="withdraw-pending-badge">0</span></div>
      <div class="nav-section">Content</div>
      <div class="nav-link" data-page="banners" onclick="loadPage('banners')"><i class="fas fa-image"></i> Sliders</div>
      <div class="nav-link" data-page="ai-prompts" onclick="loadPage('ai-prompts')"><i class="fas fa-magic"></i> AI Prompts</div>
      <div class="nav-section">Manage</div>
      <div class="nav-link" data-page="users" onclick="loadPage('users')"><i class="fas fa-users"></i> Users</div>
      <div class="nav-link" data-page="rewards" onclick="loadPage('rewards')"><i class="fas fa-coins"></i> Rewards</div>
      <div class="nav-link" data-page="notifications" onclick="loadPage('notifications')"><i class="fas fa-bell"></i> Notifications</div>
      <div class="nav-section">System</div>
      <div class="nav-link" data-page="admin-info" onclick="loadPage('admin-info')"><i class="fas fa-user-shield"></i> Admin Info</div>
      <div class="nav-link" data-page="settings" onclick="loadPage('settings')"><i class="fas fa-cog"></i> Settings</div>
      <div class="nav-link" data-page="ai-settings" onclick="loadPage('ai-settings')"><i class="fas fa-robot"></i> AI Settings</div>
      <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border-soft)">
        <div class="nav-link" style="color:var(--danger)" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</div>
      </div>
    </aside>
    <main class="main-content">
      <div class="top-bar hidden-md-up" style="display:none">
        <button class="btn btn-ghost btn-icon" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <h2>FileHub Admin</h2><div style="width:36px"></div>
      </div>
      <div id="page-content"></div>
    </main>
  </div>
</div>

<div id="item-modal" class="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    <h3 id="modal-title" class="card-title"></h3>
    <div id="modal-alert" class="alert hidden"></div>
    <form id="modal-form"></form>
  </div>
</div>

<div id="confirm-modal" class="modal-overlay">
  <div class="modal-box" style="max-width:420px">
    <h3 style="text-align:center;margin-bottom:12px">Confirm</h3>
    <p id="confirm-message" class="text-center mb-6" style="color:var(--text-sub)"></p>
    <div class="flex justify-center gap-3">
      <button class="btn btn-ghost" onclick="closeConfirmModal()">Cancel</button>
      <button class="btn btn-danger" id="confirm-action">Confirm</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyAgblSHPL02TI8lyw5XBRJEi4y3lUOlqKQ",authDomain:"file-5dd84.firebaseapp.com",databaseURL:"https://file-5dd84-default-rtdb.firebaseio.com",projectId:"file-5dd84",storageBucket:"file-5dd84.firebasestorage.app",messagingSenderId:"425635065125",appId:"1:425635065125:web:a8ce55b1745f301bb5becc"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();
const refs={users:db.ref('users'),files:db.ref('files'),banners:db.ref('banners'),settings:db.ref('settings'),notifications:db.ref('notifications'),admins:db.ref('admins'),prompts:db.ref('user_ai_prompts'),withdraws:db.ref('withdraw_requests'),transactions:db.ref('transactions')};

let currentUser=null,currentPage='dashboard';
let allUsers=[],allFiles=[],allBanners=[],allPrompts=[],allWithdraws=[],allTx=[],appSettings={};

auth.onAuthStateChanged(async (user)=>{
  if(user){
    try{
      const adminSnap=await refs.admins.child(user.uid).once('value');
      const userSnap=await refs.users.child(user.uid).once('value');
      const isFlagAdmin=(userSnap.val()||{}).isAdmin===true;
      if(adminSnap.exists()||isFlagAdmin){
        currentUser=user;showAdminPanel();await loadData();
      }else{
        await auth.signOut();showLogin();showAlert('login-alert','Not authorized as admin','error');
      }
    }catch(err){
      console.error(err);await auth.signOut();showLogin();showAlert('login-alert','Auth error: '+err.message,'error');
    }
  }else showLogin();
});

document.getElementById('login-form').addEventListener('submit',async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('login-btn');
  btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Signing in...';

async function loadData(){
  try{
    const [uSnap,fSnap,bSnap,pSnap,wSnap,sSnap,tSnap]=await Promise.all([
      refs.users.once('value'),refs.files.once('value'),refs.banners.once('value'),
      refs.prompts.once('value'),refs.withdraws.once('value'),refs.settings.once('value'),
      refs.transactions.limitToLast(100).once('value')
    ]);
    allUsers=uSnap.val()?Object.entries(uSnap.val()).map(([id,v])=>({id,...v})):[];
    allFiles=fSnap.val()?Object.entries(fSnap.val()).map(([id,v])=>({id,...v})).sort((a,b)=>(b.created_at||0)-(a.created_at||0)):[];
    allBanners=bSnap.val()?Object.entries(bSnap.val()).map(([id,v])=>({id,...v})).sort((a,b)=>(b.created_at||0)-(a.created_at||0)):[];

    allWithdraws=wSnap.val()?Object.entries(wSnap.val()).map(([id,v])=>({id,...v})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)):[];

function showAlert(id,msg,type='success'){

}

function closeModal(){document.getElementById('item-modal').classList.remove('active')}
function openConfirmModal(msg,onConfirm){
  document.getElementById('confirm-message').innerHTML=msg;

function closeConfirmModal(){document.getElementById('confirm-modal').classList.remove('active')}
function esc(str){if(!str)return '';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function fmtDate(ts){if(!ts)return 'N/A';const d=new Date(ts);return d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function genSlug(t){if(!t)return '';return t.toLowerCase().trim().replace(/[\u0980-\u09FF]/g,'').replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-+|-+$/g,'').substring(0,60)}
async function uniqueSlug(base,exclude){let s=base,c=1;while(c<=20){const snap=await refs.files.child(s).once('value');if(!snap.exists()||snap.key===exclude)return s;c++;s=base+'-'+c}return base+'-'+Date.now().toString().slice(-5)}

async function approveFile(fileId){
  const file=allFiles.find(f=>f.id===fileId);if(!file)return;
  const rw=appSettings.rewards||{};const rewardAmt=Number(rw.file_approve)||50;
  document.getElementById('modal-title').innerHTML='<i class="fas fa-check-circle" style="color:var(--success)"></i> Approve File';
  document.getElementById('modal-form').innerHTML=`
    <div style="background:var(--bg-2);padding:16px;border-radius:14px;margin-bottom:18px"><div class="flex gap-3 items-center">
      ${file.thumbnail_url?`<img src="${esc(file.thumbnail_url)}" style="width:70px;height:70px;border-radius:12px;object-fit:cover">`:''}
      <div><div style="font-weight:700;font-size:1rem;margin-bottom:4px">${esc(file.title||'Untitled')}</div>
      <div class="text-sm text-sub">${esc(file.uploadedByEmail||'Unknown')}</div>
      <div class="text-sm text-sub">Ext: ${esc(file.file_extension||'file')}</div></div></div></div>
    ${rewardAmt>0?`<div class="alert alert-info"><i class="fas fa-coins"></i> Reward: <strong>+${rewardAmt} points</strong> credited to uploader</div>`:''}
    <div class="form-group"><label class="form-label">Required Ads Steps</label><input type="number" id="ap-steps" class="form-input" value="${file.required_ads||0}" min="0"><p class="text-xs text-sub" style="margin-top:6px">0 = free, 1+ = ads watch</p></div>
    <div class="form-group"><label class="form-label">Custom Slug (Optional)</label><input type="text" id="ap-slug" class="form-input" value="${esc(file.id)}" placeholder="my-file-name"><p class="text-xs text-sub" style="margin-top:6px">URL: /file/<span id="ap-slug-preview">${esc(file.id)}</span></p></div>
    <div class="flex justify-end gap-3 mt-4"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-success" id="ap-btn"><i class="fas fa-check"></i> Approve ${rewardAmt>0?`& +${rewardAmt} pts`:''}</button></div>`;
  document.getElementById('ap-slug').addEventListener('input',function(){document.getElementById('ap-slug-preview').textContent=this.value.trim()||'auto'});
  document.getElementById('modal-form').onsubmit=async (e)=>{
    e.preventDefault();
    const btn=document.getElementById('ap-btn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Approving...';
    const newSlug=document.getElementById('ap-slug').value.trim()||file.id;
    const steps=parseInt(document.getElementById('ap-steps').value)||0;
    try{
      if(newSlug!==file.id){
        const data={...file,status:'approved',required_ads:steps,approved_at:Date.now()};delete data.id;
        const unique=await uniqueSlug(newSlug,file.id);
        await refs.files.child(unique).set(data);await refs.files.child(file.id).remove();
      }else{await refs.files.child(file.id).update({status:'approved',required_ads:steps,approved_at:Date.now()})}
      if(file.uploadedBy&&!file.reward_credited&&rewardAmt>0){
        await refs.users.child(file.uploadedBy).child('balance').transaction(b=>(b||0)+rewardAmt);
        await refs.users.child(file.uploadedBy).child('totalEarnings').transaction(b=>(b||0)+rewardAmt);
        await refs.transactions.push({userId:file.uploadedBy,type:'file_approve',amount:rewardAmt,itemId:file.id,itemTitle:file.title,createdAt:Date.now()});
        await refs.files.child(file.id).update({reward_credited:true});
      }
      if(file.uploadedBy){
        await refs.notifications.push({title:`✅ File Approved${rewardAmt>0?` +${rewardAmt} pts`:''}`,decs:`Your file **"${file.title}"** has been approved!\n\n${rewardAmt>0?`💰 Reward: **+${rewardAmt} points** credited.`:'📁 File is now live.'}\n\n🔓 Ads required: ${steps}`,created_at:Date.now(),is_read:false,target_uid:file.uploadedBy});
      }
      closeModal();await loadData();
    }catch(err){showAlert('modal-alert',err.message,'error');btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> Approve'}
  };
  openModal();
}

async function rejectFile(fileId){
  const file=allFiles.find(f=>f.id===fileId);if(!file)return;
  openConfirmModal(`Reject file <strong>"${esc(file.title)}"</strong>?<br><span class="text-sm text-sub">User will be notified.</span>`,async ()=>{
    await refs.files.child(fileId).update({status:'rejected',rejected_at:Date.now()});
    if(file.uploadedBy){await refs.notifications.push({title:'❌ File Rejected',decs:`Your file **"${file.title}"** was rejected by admin.`,created_at:Date.now(),is_read:false,target_uid:file.uploadedBy})}
    await loadData();
  });
}

  if(fileId&&!file){alert('Not found');return}
  document.getElementById('modal-title').innerHTML=fileId?'<i class="fas fa-edit" style="color:var(--primary)"></i> Edit File':'<i class="fas fa-plus-circle" style="color:var(--primary)"></i> Add New File';
  const slugInit=fileId&&!file.id.startsWith('-')?file.id:'';
  document.getElementById('modal-form').innerHTML=`
    <div class="form-group"><label class="form-label">Title *</label><input type="text" id="fl-title" class="form-input" value="${esc(file.title||'')}" oninput="autoSlug()" required></div>
    <div class="form-group"><label class="form-label">URL Slug (Optional)</label><input type="text" id="fl-slug" class="form-input" value="${esc(slugInit)}" placeholder="my-custom-slug"><p class="text-xs text-sub" style="margin-top:6px">/file/<span id="fl-slug-preview">${esc(slugInit||'auto')}</span></p></div>
    <div class="form-group"><label class="form-label">Description (Markdown)</label><textarea id="fl-desc" class="form-textarea" rows="6" required>${esc(file.description||'')}</textarea></div>
    <div class="form-group"><label class="form-label">Thumbnail URL *</label><input type="url" id="fl-thumb" class="form-input" value="${esc(file.thumbnail_url||'')}" required></div>
    <div class="form-group"><label class="form-label">Download URL *</label><input type="url" id="fl-dl" class="form-input" value="${esc(file.download_url||'')}" required></div>
    <div class="flex gap-3">
      <div class="form-group" style="flex:1"><label class="form-label">Extension</label><input type="text" id="fl-ext" class="form-input" value="${esc(file.file_extension||'.zip')}" required></div>
      <div class="form-group" style="flex:1"><label class="form-label">Ads Steps</label><input type="number" id="fl-steps" class="form-input" value="${file.required_ads||0}" min="0"></div>
    </div>
    <div class="form-group"><label class="form-label">Detail Photos (one per line)</label><textarea id="fl-photos" class="form-textarea" rows="3" style="font-family:monospace;font-size:.85rem">${esc((file.detail_photos||[]).join('\n'))}</textarea></div>
    <div class="form-group"><label class="form-label">Status</label><select id="fl-status" class="form-select">
      <option value="approved" ${file.status==='approved'||!fileId?'selected':''}>✅ Approved</option>
      <option value="pending" ${file.status==='pending'?'selected':''}>⏳ Pending</option>
      <option value="rejected" ${file.status==='rejected'?'selected':''}>❌ Rejected</option>
    </select></div>
    <div class="flex justify-end gap-3 mt-4"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary" id="fl-btn"><i class="fas fa-save"></i> Save</button></div>`;
  setTimeout(()=>{const slugEl=document.getElementById('fl-slug');if(slugEl)slugEl.dataset.edited=slugInit?'true':'false';updateFlSlugPreview()},50);
  document.getElementById('fl-slug').addEventListener('input',updateFlSlugPreview);
  document.getElementById('modal-form').onsubmit=(e)=>saveFile(e,fileId);
  openModal();
}
function autoSlug(){const s=document.getElementById('fl-slug');const t=document.getElementById('fl-title');if(!s||!t)return;if(s.dataset.edited==='true')return;s.value=genSlug(t.value);updateFlSlugPreview()}
function updateFlSlugPreview(){const s=document.getElementById('fl-slug');const p=document.getElementById('fl-slug-preview');if(!s||!p)return;s.dataset.edited='true';p.textContent=s.value.trim()||'auto'}
async function saveFile(e,fileId){
  e.preventDefault();
  const btn=document.getElementById('fl-btn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Saving...';
  const existing=fileId?allFiles.find(f=>f.id===fileId):{};
  const title=document.getElementById('fl-title').value.trim();
  const customSlug=document.getElementById('fl-slug').value.trim();
  let base=customSlug||genSlug(title)||'file-'+Date.now().toString().slice(-8);
  let finalSlug=base;
  if(!fileId||(existing.id&&existing.id!==base))finalSlug=await uniqueSlug(base,fileId);
  const data={title,description:document.getElementById('fl-desc').value,thumbnail_url:document.getElementById('fl-thumb').value,download_url:document.getElementById('fl-dl').value,file_extension:document.getElementById('fl-ext').value,required_ads:parseInt(document.getElementById('fl-steps').value)||0,detail_photos:document.getElementById('fl-photos').value.split('\n').map(u=>u.trim()).filter(u=>u),status:document.getElementById('fl-status').value,created_at:existing.created_at||Date.now(),total_downloads:existing.total_downloads||0,uploadedBy:existing.uploadedBy||currentUser.uid,uploadedByEmail:existing.uploadedByEmail||currentUser.email};
  try{
    if(fileId){if(existing.id!==finalSlug){await refs.files.child(finalSlug).set(data);await refs.files.child(existing.id).remove()}else await refs.files.child(fileId).update(data)}
    else await refs.files.child(finalSlug).set(data);
    closeModal();await loadData();
  }catch(err){showAlert('modal-alert',err.message,'error');btn.disabled=false;btn.innerHTML='<i class="fas fa-save"></i> Save'}
}
function editFile(id){openFileForm(id)}
function deleteFile(id){const f=allFiles.find(x=>x.id===id);openConfirmModal(`Delete <strong>"${esc(f?f.title:id)}"</strong> permanently?`,async ()=>{await refs.files.child(id).remove();await loadData()})}

function renderRewards(){
  const rw=appSettings.rewards||{};

async function addMethod(){
  const key=document.getElementById('nm-key').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  const name=document.getElementById('nm-name').value.trim();
  if(!key||!name){alert('Key & Name required');return}
  try{
    await refs.settings.child('withdraw').child('methods').child(key).set({
      name,image:document.getElementById('nm-image').value.trim(),number:document.getElementById('nm-number').value.trim(),
      rate:Number(document.getElementById('nm-rate').value)||100,min_points:Number(document.getElementById('nm-minp').value)||500,
      max_points:Number(document.getElementById('nm-maxp').value)||100000,charge:Number(document.getElementById('nm-charge').value)||0,
      charge_type:document.getElementById('nm-ctype').value||'flat'
    });
    await loadData();
  }catch(err){alert(err.message)}
}

async function saveMethodSettings(key){
  try{
    await refs.settings.child('withdraw').child('methods').child(key).update({
      rate:Number(document.getElementById(`m-${key}-rate`).value)||100,
      min_points:Number(document.getElementById(`m-${key}-minp`).value)||0,
      max_points:Number(document.getElementById(`m-${key}-maxp`).value)||100000,
      charge:Number(document.getElementById(`m-${key}-charge`).value)||0,
      charge_type:document.getElementById(`m-${key}-ctype`).value||'flat'
    });
    showAlert('wd-alert',`✅ ${key} settings saved`,'success');await loadData();
  }catch(err){showAlert('wd-alert',err.message,'error')}
}

async function removeMethod(key){
  openConfirmModal(`Remove method <strong>"${key}"</strong>?`,async ()=>{
    await refs.settings.child('withdraw').child('methods').child(key).remove();await loadData();
  });
}

async function approveWd(id){
  const w=allWithdraws.find(x=>x.id===id);if(!w)return;
  openConfirmModal(`Approve <strong>${w.amount} pts → ৳${w.takaAmount||0}</strong> for <strong>${esc(w.userEmail||w.userId)}</strong>?<br><span class="text-sm text-sub">Balance already deducted at request time.</span>`,async ()=>{
    await refs.withdraws.child(id).update({status:'approved',approvedAt:Date.now(),approvedBy:currentUser.uid});
    if(w.userId){await refs.notifications.push({title:'✅ Withdraw Approved',decs:`Your withdrawal of **${w.amount} points (৳${w.takaAmount||0})** has been approved!\n\n💳 Method: ${w.method}\n📱 Account: ${w.account}\n\nআপনার একাউন্টে টাকা পাঠানো হয়েছে।`,created_at:Date.now(),is_read:false,target_uid:w.userId})}
    await loadData();
  });
}

async function rejectWd(id){
  const w=allWithdraws.find(x=>x.id===id);if(!w)return;
  openConfirmModal(`Reject <strong>${w.amount} pts</strong> withdraw?<br><span class="text-sm" style="color:var(--success);font-weight:600">💰 ${w.amount} points will be refunded</span>`,async ()=>{
    await refs.withdraws.child(id).update({status:'rejected',rejectedAt:Date.now(),rejectedBy:currentUser.uid});
    if(w.userId){
      await refs.users.child(w.userId).child('balance').transaction(b=>(b||0)+w.amount);
      await refs.transactions.push({userId:w.userId,type:'withdraw_refund',amount:w.amount,createdAt:Date.now()});
      await refs.notifications.push({title:'❌ Withdraw Rejected',decs:`Your withdrawal of **${w.amount} points** was rejected.\n\n💰 Amount **fully refunded** to your balance.`,created_at:Date.now(),is_read:false,target_uid:w.userId});
    }
    await loadData();
  });
}

async function approvePrompt(id){
  const p=allPrompts.find(x=>x.id===id);if(!p)return;
  const rw=appSettings.rewards||{};const rewardAmt=Number(rw.prompt_approve)||30;
  document.getElementById('modal-title').innerHTML='<i class="fas fa-check-circle" style="color:var(--success)"></i> Approve Prompt';
  document.getElementById('modal-form').innerHTML=`
    ${rewardAmt>0?`<div class="alert alert-info"><i class="fas fa-coins"></i> Reward: <strong>+${rewardAmt} points</strong> to uploader</div>`:''}
    <div class="form-group"><label class="form-label">Title</label><input type="text" id="ap-title" class="form-input" value="${esc(p.title||'')}" required></div>
    <div class="form-group"><label class="form-label">Prompt Text</label><textarea id="ap-text" class="form-textarea" rows="4" required style="font-family:monospace;font-size:.85rem">${esc(p.prompt||'')}</textarea></div>
    <div class="form-group"><label class="form-label">Sample Image URL</label><input type="url" id="ap-sample" class="form-input" value="${esc(p.sample_image||'')}"></div>
    <div class="form-group"><label class="form-label">Detail Images (one per line)</label><textarea id="ap-details" class="form-textarea" rows="3" style="font-family:monospace;font-size:.82rem">${esc((p.detail_photos||[]).join('\n'))}</textarea></div>
    <div class="form-group"><label class="form-label">Required Ads Steps</label><input type="number" id="ap-ads" class="form-input" value="${p.required_ads||0}" min="0"></div>
    <div class="flex justify-end gap-3 mt-4"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-success" id="ap-btn"><i class="fas fa-check"></i> Approve ${rewardAmt>0?`& +${rewardAmt} pts`:''}</button></div>`;
  document.getElementById('modal-form').onsubmit=async (e)=>{
    e.preventDefault();
    const btn=document.getElementById('ap-btn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Approving...';
    const steps=parseInt(document.getElementById('ap-ads').value)||0;
    try{
      await refs.prompts.child(id).update({title:document.getElementById('ap-title').value,prompt:document.getElementById('ap-text').value,sample_image:document.getElementById('ap-sample').value,detail_photos:document.getElementById('ap-details').value.split('\n').map(u=>u.trim()).filter(u=>u),required_ads:steps,status:'approved',approved_at:Date.now()});
      if(p.uploadedBy&&rewardAmt>0&&p.status!=='approved'){
        await refs.users.child(p.uploadedBy).child('balance').transaction(b=>(b||0)+rewardAmt);
        await refs.users.child(p.uploadedBy).child('totalEarnings').transaction(b=>(b||0)+rewardAmt);
        await refs.transactions.push({userId:p.uploadedBy,type:'prompt_approve',amount:rewardAmt,itemId:id,itemTitle:p.title,createdAt:Date.now()});
      }
      if(p.uploadedBy){await refs.notifications.push({title:`✅ Prompt Approved${rewardAmt>0?` +${rewardAmt} pts`:''}`,decs:`Your prompt **"${p.title}"** has been approved!\n\n${rewardAmt>0?`💰 Reward: **+${rewardAmt} points** credited.`:''}\n\n🔓 Ads required: ${steps}`,created_at:Date.now(),is_read:false,target_uid:p.uploadedBy})}
      closeModal();await loadData();
    }catch(err){showAlert('modal-alert',err.message,'error');btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> Approve'}
  };
  openModal();
}

      <div class="text-sm text-sub" style="margin-top:8px">Current Balance</div><div class="font-bold" style="font-size:1.4rem;color:var(--primary)">${u.balance||0} pts</div>
    </div>
    <div class="form-group"><label class="form-label">Amount (positive to add, negative to subtract)</label><input type="number" id="bal-amt" class="form-input" placeholder="e.g. 50 or -20"></div>
    <div class="form-group"><label class="form-label">Reason (optional)</label><input type="text" id="bal-reason" class="form-input" placeholder="e.g. Bonus, correction..."></div>
    <div class="flex justify-end gap-3 mt-4"><button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Apply</button></div>`;
  document.getElementById('modal-form').onsubmit=async (e)=>{
    e.preventDefault();
    const amt=Number(document.getElementById('bal-amt').value);if(!amt)return;
    const reason=document.getElementById('bal-reason').value.trim();
    await refs.users.child(userId).child('balance').transaction(b=>(b||0)+amt);
    await refs.transactions.push({userId,type:amt>0?'admin_credit':'admin_debit',amount:amt,reason,createdAt:Date.now(),by:currentUser.uid});
    await refs.notifications.push({title:amt>0?`+${amt} points added`:`${amt} points deducted`,decs:`Admin adjusted your balance by **${amt>0?'+':''}${amt} points**${reason?`\n\nReason: ${reason}`:''}`,created_at:Date.now(),is_read:false,target_uid:userId});
    closeModal();await loadData();
  };
  openModal();
}

      </form>

    <div class="card"><h3 class="card-title"><i class="fas fa-history"></i> Recent</h3>
      <div class="table-wrap"><table class="data-table"><thead><tr><th>Title</th><th>Target</th><th>Date</th><th></th></tr></thead><tbody id="n-list"><tr><td colspan="4" class="text-center text-sub" style="padding:30px">Loading...</td></tr></tbody></table></div>
    </div>`;
  loadRecentNotifs();
  document.getElementById('n-form').addEventListener('submit',async (e)=>{
    e.preventDefault();
    const btn=document.getElementById('n-btn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Sending...';
    try{await refs.notifications.push({title:document.getElementById('n-title').value,decs:document.getElementById('n-msg').value,created_at:Date.now(),is_read:false,target_uid:document.getElementById('n-target').value.trim()||'all'});showAlert('n-alert','✅ Sent','success');document.getElementById('n-form').reset();loadRecentNotifs()}
    catch(err){showAlert('n-alert',err.message,'error')}
    btn.disabled=false;btn.innerHTML='<i class="fas fa-paper-plane"></i> Send';
  });
}
async function loadRecentNotifs(){
  try{
    const snap=await refs.notifications.orderByChild('created_at').limitToLast(20).once('value');
    const items=snap.val()?Object.entries(snap.val()).map(([id,v])=>({id,...v})).sort((a,b)=>(b.created_at||0)-(a.created_at||0)):[];
    const list=document.getElementById('n-list');if(!list)return;
    list.innerHTML=items.length?items.map(n=>`<tr>
      <td class="font-bold truncate" style="max-width:240px">${esc(n.title||'')}</td>
      <td class="text-sm">${n.target_uid==='all'||!n.target_uid?'<span class="badge badge-active">All</span>':`<span class="font-mono text-xs">${n.target_uid.substring(0,8)}...</span>`}</td>
      <td class="text-sm text-sub">${fmtDate(n.created_at)}</td>
      <td><button class="btn btn-danger btn-sm btn-icon" onclick="deleteNotif('${n.id}')"><i class="fas fa-trash"></i></button></td>
    </tr>`).join(''):'<tr><td colspan="4" class="text-center text-sub" style="padding:30px">None</td></tr>';
  }catch(e){console.error(e)}
}
function deleteNotif(id){openConfirmModal('Delete this notification?',async ()=>{await refs.notifications.child(id).remove();loadRecentNotifs()})}

          <textarea id="s-maint-message" class="form-textarea" rows="3" placeholder="আমরা রক্ষণাবেক্ষণের জন্য কাজ করছি...">${esc(maint.message||'🚧 সাইট মেইনটেইন করা হচ্ছে। অনুগ্রহ করে কিছুক্ষণ পর আবার চেষ্টা করুন।')}</textarea></div>
        <div class="alert alert-warn"><i class="fas fa-info-circle"></i> Enable করলে সাধারণ ইউজাররা সাইটে ঢুকতে পারবে না। শুধু admin দেখতে পাবে।</div>
        <button type="submit" class="btn btn-primary" style="margin-top:12px"><i class="fas fa-save"></i> Save</button>
      </form>
    </div>

    <div class="card">
      <h3 class="card-title"><i class="fas fa-wallet" style="color:var(--primary)"></i> Withdraw System</h3>
      <form id="wd-toggle-form">
        <div class="checkbox-row">
          <input type="checkbox" id="s-wd-enabled" ${wd.enabled!==false?'checked':''}>
          <label for="s-wd-enabled">Enable Withdraw System</label>
        </div>
        <div class="alert alert-warn"><i class="fas fa-info-circle"></i> বন্ধ করলে ইউজাররা withdraw request দিতে পারবে না। Pending request admin approve/reject করতে পারবে।</div>
        <button type="submit" class="btn btn-primary" style="margin-top:12px"><i class="fas fa-save"></i> Save</button>
      </form>
    </div>

    <div class="card">
      <h3 class="card-title"><i class="fas fa-ad" style="color:var(--accent)"></i> Ad Network</h3>
      <form id="ad-form">
        <div class="form-group"><label class="form-label">Adsterra Direct Link</label><input type="url" id="s-ad-link" class="form-input" value="${esc(ads.adsterraDirectLink||'')}" placeholder="https://www.effectivegatecpm.com/xxx"></div>
        <div class="form-group"><label class="form-label">Ads Timer (Seconds per step)</label><input type="number" id="s-ad-timer" class="form-input" value="${ads.step_timer_seconds||8}" min="3" max="60"><p class="text-xs text-sub" style="margin-top:6px">টাইমার শেষ হলে auto unlock + ফিরে আসবে</p></div>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
      </form>
    </div>`;

  document.getElementById('app-form').addEventListener('submit',async (e)=>{
    e.preventDefault();
    await refs.settings.child('app').update({appName:document.getElementById('s-app-name').value,scrollingNotice:document.getElementById('s-app-notice').value});
    showAlert('s-alert','✅ Saved','success');await loadData();
  });

  document.getElementById('maint-form').addEventListener('submit',async (e)=>{
    e.preventDefault();
    await refs.settings.child('maintenance').update({
      enabled: document.getElementById('s-maint-enabled').checked,
      message: document.getElementById('s-maint-message').value,
    });
    showAlert('s-alert','✅ Maintenance settings saved','success');await loadData();
  });

  document.getElementById('wd-toggle-form').addEventListener('submit',async (e)=>{
    e.preventDefault();
    const wd=appSettings.withdraw||{};
    await refs.settings.child('withdraw').update({...wd, enabled: document.getElementById('s-wd-enabled').checked});
    showAlert('s-alert','✅ Withdraw settings saved','success');await loadData();
  });

  document.getElementById('ad-form').addEventListener('submit',async (e)=>{
    e.preventDefault();
    await refs.settings.child('ads').update({
      adsterraDirectLink: document.getElementById('s-ad-link').value.trim(),
      step_timer_seconds: Number(document.getElementById('s-ad-timer').value)||8,
    });
    showAlert('s-alert','✅ Ad settings saved','success');await loadData();
  });
}

// ============ AI SETTINGS ============
function renderAISettings(){
  const ai=appSettings.ai||{};const key=appSettings.aiApiKey||ai.apiKey||'';
  document.getElementById('page-content').innerHTML=`
    ${pageHeader('AI Settings','robot')}
    <div id="s-alert" class="alert hidden"></div>
    <div class="card"><h3 class="card-title"><i class="fas fa-robot" style="color:var(--primary)"></i> AI Chat Assistant</h3>
      <form id="ai-form">
        <div class="checkbox-row"><input type="checkbox" id="s-ai-enabled" ${ai.enabled!==false?'checked':''}><label for="s-ai-enabled">Enable AI Chat</label></div>
        <div class="form-group"><label class="form-label">API URL</label><input type="url" id="s-ai-url" class="form-input" value="${esc(ai.apiURL||'https://api.openai.com/v1/chat/completions')}"></div>
        <div class="form-group"><label class="form-label">API Key</label><input type="password" id="s-ai-key" class="form-input" value="${esc(key)}"></div>
        <div class="form-group"><label class="form-label">Model</label><input type="text" id="s-ai-model" class="form-input" value="${esc(ai.model||'gpt-4o-mini')}"></div>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
      </form>
    </div>`;
  document.getElementById('ai-form').addEventListener('submit',async (e)=>{
    e.preventDefault();
    const k=document.getElementById('s-ai-key').value.trim();
    await refs.settings.child('ai').update({enabled:document.getElementById('s-ai-enabled').checked,apiURL:document.getElementById('s-ai-url').value.trim(),apiKey:k,model:document.getElementById('s-ai-model').value.trim()||'gpt-4o-mini'});
    await refs.settings.child('aiApiKey').set(k);
    showAlert('s-alert','✅ Saved','success');await loadData();
  });
}

window.toggleBan=toggleBan;window.adjustBalance=adjustBalance;window.editUser=editUser;window.deleteNotif=deleteNotif;
